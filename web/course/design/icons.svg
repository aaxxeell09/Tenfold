<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tenfold node and interface icons</title>

  <defs>
    
    <symbol id="icon-lesson" viewBox="0 0 48 48">
      <rect x="14" y="20" width="21" height="22" rx="10" fill="currentColor"></rect>
      <rect x="21" y="5" width="8" height="19" rx="4" fill="currentColor"></rect>
      <rect x="30" y="16" width="7" height="9" rx="3.5" fill="currentColor"></rect>
      <rect x="7" y="24" width="12" height="7" rx="3.5" transform="rotate(-24 13 27)" fill="currentColor"></rect>
    </symbol>

    <symbol id="icon-lesson-done" viewBox="0 0 48 48">
      <path d="M 11 25 L 20 34 L 37 14" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>

    <symbol id="icon-lesson-locked" viewBox="0 0 48 48">
      <rect x="12" y="22" width="24" height="18" rx="5" fill="currentColor"></rect>
      <path d="M 18 22 V 17 a 6 6 0 0 1 12 0 V 22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"></path>
    </symbol>

    <symbol id="icon-boss" viewBox="0 0 48 48">
      <rect x="4" y="20" width="17" height="18" rx="8" transform="rotate(-12 12 29)" fill="currentColor"></rect>
      <rect x="27" y="20" width="17" height="18" rx="8" transform="rotate(12 36 29)" fill="currentColor"></rect>
      <rect x="9" y="7" width="7" height="16" rx="3.5" transform="rotate(-16 12 15)" fill="currentColor"></rect>
      <rect x="18" y="6" width="7" height="17" rx="3.5" transform="rotate(-6 21 14)" fill="currentColor"></rect>
      <rect x="23" y="6" width="7" height="17" rx="3.5" transform="rotate(6 27 14)" fill="currentColor"></rect>
      <rect x="32" y="7" width="7" height="16" rx="3.5" transform="rotate(16 36 15)" fill="currentColor"></rect>
      <circle cx="24" cy="14" r="4" fill="currentColor"></circle>
    </symbol>

    <symbol id="icon-boss-done" viewBox="0 0 48 48">
      <rect x="4" y="22" width="17" height="17" rx="8" transform="rotate(-12 12 30)" fill="currentColor"></rect>
      <rect x="27" y="22" width="17" height="17" rx="8" transform="rotate(12 36 30)" fill="currentColor"></rect>
      <path d="M 13 16 L 21 24 L 36 7" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>

    <symbol id="icon-boss-locked" viewBox="0 0 48 48">
      <rect x="4" y="22" width="17" height="17" rx="8" transform="rotate(-12 12 30)" fill="currentColor"></rect>
      <rect x="27" y="22" width="17" height="17" rx="8" transform="rotate(12 36 30)" fill="currentColor"></rect>
      <rect x="15" y="8" width="18" height="14" rx="4" fill="currentColor"></rect>
      <path d="M 19 8 V 5 a 5 5 0 0 1 10 0 V 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
    </symbol>

    
    <symbol id="icon-chest" viewBox="0 0 88 80">
      <rect x="10" y="34" width="68" height="34" rx="7" fill="#f8c62c"></rect>
      <rect x="6" y="18" width="76" height="20" rx="9" fill="#fad765"></rect>
      <rect x="10" y="60" width="68" height="8" rx="4" fill="#dda80e"></rect>
      <rect x="38" y="18" width="12" height="50" rx="4" fill="#dda80e"></rect>
      <circle cx="44" cy="43" r="6" fill="#ffffff"></circle>
    </symbol>

    <symbol id="icon-chest-locked" viewBox="0 0 88 80">
      <rect x="10" y="34" width="68" height="34" rx="7" fill="#e2e7f5"></rect>
      <rect x="6" y="18" width="76" height="20" rx="9" fill="#eef1fb"></rect>
      <rect x="10" y="60" width="68" height="8" rx="4" fill="#b9c1d8"></rect>
      <rect x="38" y="18" width="12" height="50" rx="4" fill="#b9c1d8"></rect>
      <circle cx="44" cy="43" r="6" fill="#ffffff"></circle>
    </symbol>

    
    <symbol id="icon-home" viewBox="0 0 48 48">
      <path d="M 24 6 L 43 23 h -6 v 17 a 2 2 0 0 1 -2 2 H 13 a 2 2 0 0 1 -2 -2 V 23 H 5 Z" fill="currentColor"></path>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 48 48">
      <rect x="6" y="6" width="15" height="15" rx="4" fill="currentColor"></rect>
      <rect x="27" y="6" width="15" height="15" rx="4" fill="currentColor"></rect>
      <rect x="6" y="27" width="15" height="15" rx="4" fill="currentColor"></rect>
      <rect x="27" y="27" width="15" height="15" rx="4" fill="currentColor"></rect>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 48 48">
      <circle cx="24" cy="16" r="9" fill="currentColor"></circle>
      <path d="M 8 43 a 16 16 0 0 1 32 0 Z" fill="currentColor"></path>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 48 48">
      <polygon points="24,3 30.2,17.6 46,19.1 34,29.6 37.4,45 24,37 10.6,45 14,29.6 2,19.1 17.8,17.6" fill="currentColor"></polygon>
    </symbol>
    <symbol id="icon-flame" viewBox="0 0 48 48">
      <path d="M 24 2 C 36 14 42 22 24 46 C 6 22 12 14 24 2 Z" fill="currentColor"></path>
    </symbol>
    <symbol id="icon-xp" viewBox="0 0 48 48">
      <polygon points="27,2 10,27 22,27 19,46 38,19 25,19" fill="currentColor"></polygon>
    </symbol>
    <symbol id="icon-mic" viewBox="0 0 48 48">
      <rect x="18" y="4" width="12" height="24" rx="6" fill="currentColor"></rect>
      <path d="M 11 23 a 13 13 0 0 0 26 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"></path>
      <rect x="21" y="36" width="6" height="9" rx="3" fill="currentColor"></rect>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 48 48">
      <path d="M 11 11 L 37 37 M 37 11 L 11 37" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"></path>
    </symbol>
    <symbol id="icon-camera" viewBox="0 0 48 48">
      <rect x="4" y="12" width="40" height="26" rx="7" fill="currentColor"></rect>
      <circle cx="24" cy="25" r="7" fill="#ffffff"></circle>
      <rect x="17" y="7" width="14" height="7" rx="3" fill="currentColor"></rect>
    </symbol>
    <symbol id="icon-unicorn" viewBox="0 0 48 48">
      <rect x="30" y="13" width="11" height="24" rx="5.5" fill="#36a9f5"></rect>
      <polygon points="33,10 41,5 39,17" fill="#8b6ee0"></polygon>
      <polygon points="25,1 30,16 19,16" fill="#f8c62c"></polygon>
      <ellipse cx="24" cy="28" rx="14" ry="13" fill="#8b6ee0"></ellipse>
      <ellipse cx="18" cy="35" rx="9" ry="7" fill="#e6c2ff"></ellipse>
      <circle cx="20" cy="25" r="2.6" fill="#35406b"></circle>
      <circle cx="14" cy="35" r="1.8" fill="#b07ad0"></circle>
    </symbol>

    <symbol id="icon-check" viewBox="0 0 48 48">
      <path d="M 11 25 L 20 34 L 37 14" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
  </defs>

  
  <rect width="760" height="220" fill="#ffffff"></rect>
  <g color="#2fae82">
    <use href="#icon-lesson" x="20" y="30" width="56" height="56"></use>
    <use href="#icon-lesson-done" x="100" y="30" width="56" height="56"></use>
    <use href="#icon-boss" x="260" y="30" width="56" height="56"></use>
    <use href="#icon-boss-done" x="340" y="30" width="56" height="56"></use>
  </g>
  <g color="#b9c1d8">
    <use href="#icon-lesson-locked" x="180" y="30" width="56" height="56"></use>
    <use href="#icon-boss-locked" x="420" y="30" width="56" height="56"></use>
  </g>
  <use href="#icon-chest" x="500" y="26" width="66" height="60"></use>
  <use href="#icon-chest-locked" x="580" y="26" width="66" height="60"></use>
  <g color="#5b6488">
    <use href="#icon-home" x="20" y="120" width="34" height="34"></use>
    <use href="#icon-grid" x="70" y="120" width="34" height="34"></use>
    <use href="#icon-user" x="120" y="120" width="34" height="34"></use>
    <use href="#icon-mic" x="170" y="120" width="34" height="34"></use>
    <use href="#icon-close" x="220" y="120" width="34" height="34"></use>
    <use href="#icon-camera" x="270" y="120" width="34" height="34"></use>
  </g>
  <g color="#f8c62c">
    <use href="#icon-star" x="320" y="120" width="34" height="34"></use>
    <use href="#icon-xp" x="370" y="120" width="34" height="34"></use>
  </g>
  <g color="#f79433"><use href="#icon-flame" x="420" y="120" width="34" height="34"></use></g>
  <use href="#icon-unicorn" x="470" y="120" width="34" height="34"></use>
  <g fill="#5b6488" font-family="Nunito, system-ui, sans-serif" font-size="13" font-weight="800">
    <text x="20" y="104">lesson / done / locked</text>
    <text x="260" y="104">boss / done / locked</text>
    <text x="500" y="104">chest / locked</text>
    <text x="20" y="176">interface icons</text>
  </g>
</svg>