<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Tenfold · Lesson complete</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lesson.css">
</head>
<body class="tablet">
<div class="frame">

  <section class="finish" id="finish">
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <div class="finish-inner">
      <div class="tally tally-cheer" data-tally="happy" data-accessories="headband" style="width:170px"></div>
      <h1>Lesson complete!</h1>
      <p class="finish-sub">Your 8 times are getting quick.</p>

      <div class="big-stars" aria-label="3 stars earned">
        <svg viewBox="0 0 48 48" style="color:var(--yellow)"><use href="#icon-star"></use></svg>
        <svg viewBox="0 0 48 48" style="color:var(--yellow)"><use href="#icon-star"></use></svg>
        <svg viewBox="0 0 48 48" style="color:var(--yellow)"><use href="#icon-star"></use></svg>
      </div>

      <div class="cards cards-2">
        <div class="card">
          <div class="card-label">Total XP</div>
          <div class="card-value"><svg viewBox="0 0 48 48" style="color:var(--yellow-lip)"><use href="#icon-xp"></use></svg>24</div>
        </div>
        <div class="card card-green">
          <div class="card-label">Stars earned</div>
          <div class="card-value"><svg viewBox="0 0 48 48" style="color:var(--green)"><use href="#icon-star"></use></svg>3 of 3</div>
        </div>
      </div>

      <a class="btn btn-wide btn-xl" href="learn.html">Continue</a>
      <button class="finish-alt" type="button" onclick="window.location.href='lesson.html'">Practice this again</button>
    </div>
  </section>

</div>

<script src="tally.js"></script>
<script>
(function () {
  var host = document.getElementById('confetti');
  var colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ce82ff', '#ff9600'];
  for (var i = 0; i < 44; i++) {
    var bit = document.createElement('i');
    bit.style.left = (Math.random() * 100) + '%';
    bit.style.background = colors[i % colors.length];
    bit.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
    bit.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    bit.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    bit.style.animationDelay = (Math.random() * 1.2) + 's';
    host.appendChild(bit);
  }
})();
</script>
</body>
</html>
