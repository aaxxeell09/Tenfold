<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Nimble · Lesson complete</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.tablet{height:100vh;overflow:hidden;background:var(--polar);display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;flex:none;width:1194px;height:834px;overflow:hidden;background:var(--snow);
    transform:scale(var(--fit,1));transform-origin:center center;
  }
  .pane{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:48px;text-align:center;
    transition:opacity .45s ease,transform .45s cubic-bezier(.3,.7,.3,1);
  }
  .pane.out{opacity:0;transform:translateY(-28px);pointer-events:none}
  .pane.in{opacity:0;transform:translateY(28px);pointer-events:none}
  .pane.in.show{opacity:1;transform:none;pointer-events:auto}

  h1{margin:0;font-size:46px;font-weight:900;color:var(--eel)}
  .sub{margin:0;font-size:21px;font-weight:700;color:var(--wolf)}

  .gain{display:flex;align-items:center;gap:14px;font-size:78px;font-weight:900;color:var(--green-lip)}
  .gain svg{width:62px;height:62px;color:var(--yellow)}

  .lvlwrap{width:560px}
  .lvlhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .lvlhead b{font-size:22px;font-weight:900;color:var(--eel)}
  .lvlhead span{font-size:18px;font-weight:800;color:var(--hare)}
  .track{position:relative;height:26px;border-radius:13px;background:var(--swan);overflow:hidden}
  .track i{position:absolute;inset:0 auto 0 0;width:0;border-radius:13px;background:var(--green);transition:width .9s cubic-bezier(.3,.7,.3,1)}

  .tally{display:block;background:url("art/hand2.png") no-repeat center / contain}
  .t-done{width:190px;height:225px}
  .t-up{width:300px;height:356px}

  .btn-row{display:flex;gap:16px;margin-top:8px}
  .btn2{
    min-height:64px;padding:0 40px;border:0;border-radius:18px;background:var(--green);color:var(--snow);
    box-shadow:0 5px 0 var(--green-lip);font-family:var(--font);font-size:20px;font-weight:900;
    letter-spacing:.6px;text-transform:uppercase;text-decoration:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:transform 70ms ease,box-shadow 70ms ease;
  }
  .btn2:active{transform:translateY(5px);box-shadow:0 0 0 var(--green-lip)}
  .btn2.ghost{background:var(--snow);color:var(--wolf);box-shadow:0 0 0 2px var(--swan) inset}
  .btn2.ghost:active{transform:translateY(3px)}

  .newlevel{
    padding:10px 24px;border-radius:16px;background:var(--green-soft);color:var(--green-lip);
    font-size:19px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  }
  .earned{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;color:var(--wolf)}
  .earned b{color:var(--eel)}

  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confetti i{position:absolute;top:-24px;width:13px;height:19px;border-radius:3px;opacity:0;animation:fall linear infinite}
  @keyframes fall{
    0%{opacity:0;transform:translateY(0) rotate(0)}
    10%{opacity:1}
    100%{opacity:0;transform:translateY(880px) translateX(var(--dx)) rotate(var(--rot))}
  }
</style>
</head>
<body class="tablet">
<div class="frame" id="frame">

  <section class="pane" id="p1">
    <div class="tally t-done" id="t-done" role="img" aria-label="Tally"></div>
    <h1>Lesson complete!</h1>
    <p class="sub">Your 8 times are getting quick.</p>
    <div class="gain"><svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="27,2 10,27 22,27 19,46 38,19 25,19" fill="#f8c62c"></polygon></svg><span id="gain">0</span> XP</div>
    <div class="lvlwrap">
      <div class="lvlhead"><b id="n1">Finger Counter</b><span id="x1">60 / 150 XP</span></div>
      <div class="track"><i id="f1"></i></div>
    </div>
    <div class="btn-row"><a class="btn2" href="practice.html" id="cont1">Continue</a></div>
  </section>

  <section class="pane in" id="p2">
    <div class="confetti" id="confetti"></div>
    <div class="tally t-up" id="t-up" role="img" aria-label="Tally"></div>
    <div class="newlevel">Level up</div>
    <h1 id="n2">Tip Toucher</h1>
    <p class="earned">New for Tally: <b id="acc">glasses</b></p>
    <div class="lvlwrap">
      <div class="lvlhead"><b id="n3">Tip Toucher</b><span id="x2">0 / 150 XP</span></div>
      <div class="track"><i id="f2" style="width:0"></i></div>
    </div>
    <div class="btn-row">
      <a class="btn2" href="practice.html">Continue</a>
      <a class="btn2 ghost" href="profile.html">See Tally</a>
    </div>
  </section>

</div>

<script src="levels.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var GAIN = Number(q.get('gain')) || 30;
  // ?levelup=1 starts the lesson just under the next level that earns an accessory
  var before = TF.xp();
  if (q.get('levelup')) {
    var cur = TF.info(before).level;
    var target = Object.keys(TF.ACC).map(Number).filter(function (l) { return l > cur; })[0] || cur + 1;
    before = (target - 1) * TF.SPAN - 20;
  }
  var after = before + GAIN;
  var b = TF.info(before), a = TF.info(after);

  document.getElementById('n1').textContent = b.name;
  document.getElementById('x1').textContent = b.inLevel + ' / ' + b.span + ' XP';
  document.getElementById('f1').style.width = b.percent + '%';

  // XP counts up, then the bar fills to where the lesson leaves it
  var DUR = 1100, t0 = Date.now(), settled = false;
  function paint() {
    var k = Math.min(1, (Date.now() - t0) / DUR);
    document.getElementById('gain').textContent = Math.round(GAIN * k);
    if (k < 1) { requestAnimationFrame(paint); return; }
    settle();
  }
  function settle() {
    if (settled) return;
    settled = true;
    document.getElementById('gain').textContent = GAIN;
    var sameLevel = a.level === b.level;
    document.getElementById('f1').style.width = (sameLevel ? a.percent : 100) + '%';
    document.getElementById('x1').textContent = (sameLevel ? a.inLevel : b.span) + ' / ' + b.span + ' XP';
    if (!sameLevel) setTimeout(levelUp, 1000);
  }
  requestAnimationFrame(paint);
  setTimeout(settle, DUR + 220);

  function levelUp() {
    document.getElementById('p1').classList.add('out');
    var p2 = document.getElementById('p2');
    p2.classList.add('show');
    document.getElementById('n2').textContent = a.name;
    document.getElementById('n3').textContent = a.name;
    document.getElementById('x2').textContent = a.inLevel + ' / ' + a.span + ' XP';
    setTimeout(function () { document.getElementById('f2').style.width = a.percent + '%'; }, 350);

    var earned = TF.earnedAt(a.level);
    var line = document.querySelector('.earned');
    if (earned) document.getElementById('acc').textContent = earned === 'hat' ? 'wizard hat' : earned;
    else line.style.display = 'none';

    confetti();
  }

  function confetti() {
    var host = document.getElementById('confetti');
    var colors = ['#2563d9', '#36a9f5', '#2fae82', '#ef5a4f', '#f8c62c', '#8b6ee0'];
    for (var i = 0; i < 46; i++) {
      var bit = document.createElement('i');
      bit.style.left = (Math.random() * 100) + '%';
      bit.style.background = colors[i % colors.length];
      bit.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
      bit.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      bit.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
      bit.style.animationDelay = (Math.random() * 1.1) + 's';
      host.appendChild(bit);
    }
  }

  if (!q.get('levelup')) TF.setXp(after);

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
