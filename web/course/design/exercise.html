<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Nimble · Exercise</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.tablet{height:100vh;overflow:hidden;background:var(--polar);display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;flex:none;width:1194px;height:834px;overflow:hidden;background:var(--snow);
    transform:scale(var(--fit,1));transform-origin:center center;
    display:flex;flex-direction:column;padding:16px 28px 14px;gap:10px;
  }

  /* top: quit, progress, counter */
  .top{display:flex;align-items:center;gap:22px;flex:none;height:62px}
  .quit{width:56px;height:56px;flex:none;display:block;transition:transform 60ms ease}
  .quit span{display:block;width:100%;height:100%;background:url("art/btn-back.png") no-repeat center / contain}
  .quit:active{transform:translateY(3px)}
  .bar{position:relative;width:190px;height:14px;border-radius:7px;background:var(--swan);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:11px;background:var(--green);transition:width .5s cubic-bezier(.3,.7,.3,1)}
  .count{font-size:13px;font-weight:900;color:var(--hare);letter-spacing:1px;text-transform:uppercase}
  .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

  /* the exercise, very large */
  .ex{margin:0;flex:1;text-align:center;font-size:56px;line-height:1;font-weight:900;color:var(--eel);font-variant-numeric:tabular-nums}
  .ex .eq{color:var(--green)}

  /* camera */
  .camwrap{flex:1;display:flex;justify-content:center;align-items:center;min-height:0}
  .cam{
    position:relative;width:1038px;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:#242a45;
    box-shadow:0 8px 0 rgba(53,64,107,.16);
  }
  .camtag{
    position:absolute;top:16px;left:20px;font-size:12px;font-weight:900;letter-spacing:1.6px;
    text-transform:uppercase;color:rgba(255,255,255,.45);
  }
  .gh{position:absolute;inset:0;width:100%;height:100%}
  .gh .handline{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.34);stroke-width:5;stroke-linejoin:round;transition:fill .4s ease,stroke .4s ease}
  .frame.detected .gh .handline{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.72)}
  .gh .hand{transition:transform .5s cubic-bezier(.3,.7,.3,1)}
  .gh .halo{fill:none}
  .gh .tip{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.34);stroke-width:3;transition:fill .3s ease,stroke .3s ease}
  .gh .num{fill:rgba(255,255,255,.62);font-family:var(--font);font-size:27px;font-weight:900;text-anchor:middle;transition:fill .3s ease}
  /* expected fingers glow green, a wrong one turns orange */
  .gh .fin.want .tip{fill:var(--green);stroke:var(--green-lip)}
  .gh .fin.want .num{fill:#fff}
  .gh .fin.want .halo{fill:rgba(47,174,130,.3);animation:halo 1.3s ease-in-out infinite}
  .gh .fin.bad .tip{fill:var(--orange);stroke:#d97c1c}
  .gh .fin.bad .num{fill:#fff}
  .gh .fin.bad .halo{fill:rgba(247,148,51,.32);animation:halo 1.3s ease-in-out infinite}
  @keyframes halo{0%,100%{r:38px}50%{r:52px}}
  .frame.yes .gh .fin.want .halo{animation:none;r:50px}
  [data-state="blind"] .gh{opacity:.2}

  /* coaching drawn on the hands */
  .guide{opacity:0;transition:opacity .3s ease}
  .frame.coach .guide{opacity:1}
  .guide .arc{
    fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;
    stroke-dasharray:16 13;animation:crawl 1.1s linear infinite;
  }
  @keyframes crawl{to{stroke-dashoffset:-58}}
  .guide .head{fill:var(--orange)}
  .guide .ring{fill:none;stroke:var(--green);stroke-width:6;stroke-dasharray:11 10;animation:spin 5s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  .veil{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(36,42,69,.78);color:#fff;text-align:center;
  }
  .veil b{font-size:26px;font-weight:900}
  .veil span{font-size:16px;font-weight:700;color:rgba(255,255,255,.72)}
  [data-state="blind"] .veil{display:flex}

  /* the three reasoning lines, over the bottom of the video */
  .why{
    position:absolute;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:5px;
    padding:14px 22px 16px;background:linear-gradient(transparent,rgba(20,24,44,.82) 30%);
  }
  [data-state="yes"] .why{display:flex}
  .why span{color:#fff;font-size:18px;font-weight:800;opacity:0;animation:rise .34s ease-out forwards}
  .why span b{color:#b6f0d9}
  .why span:nth-child(1){animation-delay:.10s}
  .why span:nth-child(2){animation-delay:.40s}
  .why span:nth-child(3){animation-delay:.70s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* bottom: Tally, his line, the mic */
  .foot{display:flex;align-items:center;gap:0;flex:none}
  .tally-art{width:92px;height:96px;flex:none;display:block;background:url("art/hand2.png") no-repeat center / contain;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .say{
    position:relative;margin:0 0 0 -8px;min-height:84px;max-width:660px;
    background:url("art/bubble-box.png") no-repeat center / 100% 100%;padding:15px 18px 17px 36px;
    color:var(--eel);font-size:22px;font-weight:800;line-height:1.2;display:flex;align-items:center;
  }
  .mic{
    margin-left:auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;
    border:3px solid var(--swan);border-radius:18px;color:var(--wolf);
    font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  }
  .mic .bars{display:flex;align-items:center;gap:4px;height:24px}
  .mic .bars i{width:5px;height:8px;border-radius:3px;background:var(--green);animation:mic 820ms ease-in-out infinite}
  .mic .bars i:nth-child(2){animation-delay:130ms}
  .mic .bars i:nth-child(3){animation-delay:260ms}
  .mic .bars i:nth-child(4){animation-delay:390ms}
  @keyframes mic{0%,100%{height:7px}50%{height:22px}}
  .mic.off{border-color:var(--swan);color:var(--hare)}
  .mic.off .bars i{animation:none;height:7px;background:var(--hare)}

  /* the big check that pops on a correct answer */
  .cheer-badge{
    position:absolute;left:50%;top:46%;width:210px;height:210px;margin:-105px 0 0 -105px;
    background:url("art/n-done.png") no-repeat center / contain;opacity:0;transform:scale(.4);pointer-events:none;
  }
  .frame.is-cheer .cheer-badge{animation:popin 1.1s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes popin{
    0%{opacity:0;transform:scale(.4)}
    22%{opacity:1;transform:scale(1.06)}
    36%{transform:scale(1)}
    76%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.12)}
  }

  /* prototype state switcher */
  .states{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
  .devtag{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--red-lip)}
  .frame.clean .states{display:none}
  .states button{
    border:2px dashed var(--swan);border-radius:12px;background:none;color:var(--hare);
    padding:7px 13px;font-family:var(--font);font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
  }
  .states button.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green-lip)}
</style>
</head>
<body class="tablet">
<div class="frame" id="frame" data-state="waiting">

  <div class="top">
    <a class="quit" href="practice.html" aria-label="Quit"><span></span></a>
    <p class="ex" id="ex">8 <span class="eq">×</span> 7</p>
    <div class="meta">
      <span class="count" id="count">2 of 5</span>
      <span class="bar"><i id="bar" style="width:40%"></i></span>
    </div>
  </div>

  <div class="camwrap">
    <div class="cam">
      <span class="camtag">camera</span>
      <svg class="gh" id="gh" viewBox="0 0 1194 672" aria-hidden="true"></svg>
      <div class="veil"><b>I cannot see your hands</b><span>Hold them up, palms toward me</span></div>
      <div class="why">
        <span><b>5</b> fingers at and below the touch, so 50</span>
        <span><b>2</b> tops on the left and <b>3</b> on the right, two threes make 6</span>
        <span>50 and 6 make <b>56</b></span>
      </div>
      <div class="cheer-badge"></div>
    </div>
  </div>

  <div class="foot">
    <div class="tally-art"></div>
    <p class="say" id="say">Touch your 8 with your 7.</p>
    <div class="mic" id="mic">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <span id="miclabel">Listening</span>
    </div>
  </div>

  <div class="states" id="states">
    <span class="devtag">dev only</span>
    <button type="button" data-go="waiting" class="on">Waiting</button>
    <button type="button" data-go="almost">Almost</button>
    <button type="button" data-go="yes">Yes</button>
    <button type="button" data-go="blind">Cannot see</button>
  </div>

</div>

<script>
(function () {
  var frame = document.getElementById('frame');
  var gh = document.getElementById('gh');
  var say = document.getElementById('say');
  var mic = document.getElementById('mic');
  var miclabel = document.getElementById('miclabel');

  // one traced hand per side, a numbered circle at each fingertip
  var HAND = 'M 64 430 C 58 392 48 336 38 288 C 30 250 22 216 22 192 A 22 22 0 0 1 66 192 ' +
    'L 74 250 C 74 226 72 150 72 120 A 24 24 0 0 1 120 120 ' +
    'L 126 232 C 126 208 125 122 125 93 A 25 25 0 0 1 175 93 ' +
    'L 180 236 C 180 212 180 142 180 118 A 24 24 0 0 1 228 118 ' +
    'L 238 262 C 232 282 216 296 205 308 L 269 227 A 22 22 0 0 1 303 254 ' +
    'L 239 335 C 232 346 224 354 216 366 C 210 390 206 410 204 430 Z';
  var TIPS = { 10: [44, 192], 9: [96, 120], 8: [150, 93], 7: [204, 118], 6: [286, 241] };
  var S = 1.16, TOP = 42;
  var ORIGIN = { left: 196, right: 998 };
  var PIVOT = {
    left: { x: ORIGIN.left + S * 130, y: TOP + S * 430 },
    right: { x: ORIGIN.right - S * 130, y: TOP + S * 430 }
  };
  var CLOSE_ROT = { left: 22, right: -20 }, GAP = 62;

  function base(hand, n) {
    var flip = hand === 'left' ? 1 : -1;
    return { x: ORIGIN[hand] + flip * S * TIPS[n][0], y: TOP + S * TIPS[n][1] };
  }
  function spin(p, piv, deg) {
    var r = deg * Math.PI / 180, c = Math.cos(r), s2 = Math.sin(r);
    var dx = p.x - piv.x, dy = p.y - piv.y;
    return { x: piv.x + dx * c - dy * s2, y: piv.y + dx * s2 + dy * c };
  }
  function xform(s) {
    if (!s.close) return { left: { rot: 0, tx: 0, ty: 0 }, right: { rot: 0, tx: 0, ty: 0 } };
    var pair = s.want.length === 2 ? s.want : ['left8', 'right7'];
    var a = pair[0].match(/^(left|right)(\d+)$/), b = pair[1].match(/^(left|right)(\d+)$/);
    var p1 = spin(base(a[1], a[2]), PIVOT[a[1]], CLOSE_ROT.left);
    var p2 = spin(base(b[1], b[2]), PIVOT[b[1]], CLOSE_ROT.right);
    return {
      left: { rot: CLOSE_ROT.left, tx: 0, ty: 0 },
      right: { rot: CLOSE_ROT.right, tx: (p1.x + GAP) - p2.x, ty: p1.y - p2.y }
    };
  }
  function at(k, X) {
    var m = k.match(/^(left|right)(\d+)$/), t = X[m[1]];
    var p = spin(base(m[1], m[2]), PIVOT[m[1]], t.rot);
    return { x: p.x + t.tx, y: p.y + t.ty };
  }

  function hand(side, s, X) {
    var flip = side === 'left' ? 1 : -1, t = X[side];
    var out = '<g class="hand" data-hand="' + side + '" transform="translate(' + t.tx + ',' + t.ty +
      ') rotate(' + t.rot + ' ' + PIVOT[side].x + ' ' + PIVOT[side].y + ')">' +
      '<g transform="translate(' + ORIGIN[side] + ',' + TOP + ') scale(' + (flip * S) + ',' + S + ')">' +
        '<path class="handline" d="' + HAND + '"></path></g>';
    Object.keys(TIPS).forEach(function (n) {
      var p = base(side, n);
      var cls = 'fin' + (s.want.indexOf(side + n) > -1 ? ' want' : '') + (s.bad.indexOf(side + n) > -1 ? ' bad' : '');
      out += '<g class="' + cls + '" data-hand="' + side + '" data-n="' + n + '" transform="translate(' + p.x + ',' + p.y + ')">' +
               '<circle class="halo" r="38"></circle>' +
               '<circle class="tip" r="32"></circle>' +
               '<text class="num" y="10">' + n + '</text>' +
             '</g>';
    });
    return out + '</g>';
  }

  // the correction is drawn on the hands: arc from the wrong finger to the target, target circled
  function coachSvg(s, X) {
    if (!s.coach) return '';
    var a = at(s.coach[0], X), b = at(s.coach[1], X);
    var mx = (a.x + b.x) / 2, my = Math.min(a.y, b.y) - 128;
    var ang = Math.atan2((b.y - 44) - my, b.x - mx) * 180 / Math.PI;
    return '<g class="guide">' +
      '<path class="arc" d="M ' + a.x + ' ' + (a.y - 40) + ' Q ' + mx + ' ' + my + ' ' + b.x + ' ' + (b.y - 44) + '"></path>' +
      '<polygon class="head" points="0,-15 30,0 0,15" transform="translate(' + b.x + ',' + (b.y - 44) + ') rotate(' + ang + ')"></polygon>' +
      '<circle class="ring" cx="' + b.x + '" cy="' + b.y + '" r="47"></circle></g>';
  }

  // when the pair touches, its two caps are painted above both hands so neither is hidden
  function contact(s, X) {
    if (!s.close || s.want.length !== 2) return '';
    var a = at(s.want[0], X), b = at(s.want[1], X);
    var out = '<line stroke="#2fae82" stroke-width="10" stroke-linecap="round" x1="' + a.x + '" y1="' + a.y +
              '" x2="' + b.x + '" y2="' + b.y + '"></line>';
    [[s.want[0], a], [s.want[1], b]].forEach(function (pair) {
      var n = pair[0].replace(/^(left|right)/, ''), p = pair[1];
      out += '<g class="fin want" transform="translate(' + p.x + ',' + p.y + ')">' +
             '<circle class="halo" r="38"></circle><circle class="tip" r="32"></circle>' +
             '<text class="num" y="10">' + n + '</text></g>';
    });
    return out;
  }

  function paint(s) {
    var X = xform(s);
    var order = s.close ? ['right', 'left'] : ['left', 'right'];
    gh.innerHTML = order.map(function (h) { return hand(h, s, X); }).join('') + contact(s, X) + coachSvg(s, X);
  }

  var STATES = {
    waiting: {
      say: 'Touch your 8 with your 7.', mic: 'Listening', listening: true,
      want: ['left8', 'right7'], bad: [], detected: true, close: false, pop: false
    },
    almost: {
      say: 'Almost. Move your right finger from 9 to 7.', mic: 'Listening', listening: true,
      want: ['left8'], bad: ['right9'], detected: true, close: false, pop: false,
      coach: ['right9', 'right7']
    },
    yes: {
      say: 'Yes! 8 × 7 = 56.', mic: 'Fifty six', listening: false,
      want: ['left8', 'right7'], bad: [], detected: true, close: true, pop: true
    },
    blind: {
      say: 'I cannot see your hands. Hold them up in the light.', mic: 'Paused', listening: false,
      want: [], bad: [], detected: false, close: false, pop: false
    }
  };

  function go(name) {
    var s = STATES[name] || STATES.waiting;
    frame.className = 'frame' + (s.detected ? ' detected' : '') + (name === 'yes' ? ' yes' : '');
    frame.dataset.state = name;
    say.textContent = s.say;
    miclabel.textContent = s.mic;
    mic.classList.toggle('off', !s.listening);

    paint(s);
    if (s.coach) frame.classList.add('coach');
    if (s.pop) { void frame.offsetWidth; frame.classList.add('is-cheer'); }

    Array.prototype.forEach.call(document.querySelectorAll('.states button'), function (b) {
      b.classList.toggle('on', b.dataset.go === name);
    });
  }

  document.getElementById('states').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) go(b.dataset.go);
  });
  document.addEventListener('keydown', function (e) {
    var map = { '1': 'waiting', '2': 'almost', '3': 'yes', '4': 'blind' };
    if (map[e.key]) go(map[e.key]);
  });
  document.querySelector('.cam').addEventListener('click', function () {
    var order = ['waiting', 'almost', 'yes', 'blind'];
    go(order[(order.indexOf(frame.dataset.state) + 1) % order.length]);
  });

  // ?clean=1 hides the developer switcher, for demos and screenshots
  if (new URLSearchParams(location.search).get('clean')) frame.classList.add('clean');

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  go('waiting');
})();
</script>
</body>
</html>
