<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Tenfold · Hub</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lesson.css">
</head>
<body class="tablet">
<div class="frame">

  <nav class="minibar" aria-label="More">
    <a class="nav-item" href="#profile"><span class="nav-icon"><svg viewBox="0 0 48 48"><use href="#icon-unicorn"></use></svg></span><span>Profile</span></a>
  </nav>

  <section class="hub">
    <h1 id="greeting">Which door today?</h1>

    <div class="doors">

      <a class="door" href="learn.html">
        <div class="door-top">
          <div class="kicker">Four units</div>
          <h2>Learn</h2>
        </div>
        <div class="door-body">
          <svg class="minipath" viewBox="0 0 330 250" aria-hidden="true">
            <path class="track" d="M 60 30 Q 168 58 150 92 Q 122 124 68 152 Q 26 180 158 212"></path>
            <circle cx="60" cy="34" r="17" fill="#58a700"></circle>
            <circle cx="60" cy="30" r="17" fill="#58cc02"></circle>
            <circle cx="150" cy="96" r="17" fill="#1899d6"></circle>
            <circle cx="150" cy="92" r="17" fill="#1cb0f6"></circle>
            <circle cx="68" cy="156" r="17" fill="#b7b7b7"></circle>
            <circle cx="68" cy="152" r="17" fill="#e5e5e5"></circle>
            <circle cx="158" cy="216" r="17" fill="#b7b7b7"></circle>
            <circle cx="158" cy="212" r="17" fill="#e5e5e5"></circle>
            <text x="88" y="36">First steps</text>
            <text x="178" y="98">6 to 10</text>
            <text x="96" y="158" class="lock-label">11 to 15</text>
            <text x="186" y="218" class="lock-label">16 to 20</text>
          </svg>
          <p>Four units of finger tricks, one step at a time.</p>
        </div>
      </a>

      <a class="door door-blue" href="check.html">
        <div class="door-top">
          <div class="kicker">Camera and voice</div>
          <h2>Practice</h2>
        </div>
        <div class="door-body">
          <div class="tally" data-tally="hands" aria-hidden="true"></div>
          <p>Practice with your hands</p>
        </div>
      </a>

    </div>
  </section>

</div>

<script src="tally.js"></script>
<script>
(function () {
  var name = localStorage.getItem('tenfold.name');
  if (name) document.getElementById('greeting').textContent = 'Which door today, ' + name + '?';
})();
</script>
</body>
</html>
