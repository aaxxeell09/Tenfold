<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tenfold castle</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="waiting">
<div class="fit">
<main class="screen">

  <header class="topbar">
    <span class="brand">Tenfold</span>
    <div class="chips">
      <a class="chip quiet" href="home.html">Home</a>
      <a class="chip quiet" href="tenfold.html">Practice</a>
      <div class="chip">
        <svg class="flame" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 0 C18 8 22 13 12 28 C2 13 6 8 12 0 Z" fill="#c06214"></path></svg>
        <span>6 days</span>
      </div>
    </div>
  </header>

  <div class="castle-grid">

    <div>
      <h1 class="page" style="font-size:40px;margin-bottom:14px">My castle</h1>
      <div class="map" id="map"></div>
    </div>

    <div class="side">
      <div>
        <p class="h2">Tally's wardrobe</p>
        <div class="wardrobe">
          <div class="item">
            <div class="tally" style="width:88px" data-tally="ready" data-accessories="glasses"></div>
            <span class="name">Glasses</span><span class="req">Unlocked</span>
          </div>
          <div class="item">
            <div class="tally" style="width:88px" data-tally="happy" data-accessories="headband"></div>
            <span class="name">Headband</span><span class="req">Unlocked</span>
          </div>
          <div class="item">
            <div class="tally is-locked" style="width:88px" data-tally="ready" data-accessories="hat"></div>
            <span class="name">Wizard hat</span><span class="req"><i class="lock"></i>Reach Ten Master</span>
          </div>
          <div class="item">
            <div class="tally is-locked" style="width:88px" data-tally="ready" data-accessories="cape"></div>
            <span class="name">Cape</span><span class="req"><i class="lock"></i>Streak of 10 days</span>
          </div>
        </div>
      </div>

      <div>
        <p class="h2">Badge shelf</p>
        <div class="shelf" id="shelf"></div>
      </div>

      <p class="note">A clock means a room is ready for review. Locked doors open when you meet the room in a lesson.</p>
    </div>

  </div>

</main>
</div>

<script src="tally.js"></script>
<script>
(function () {
  var nums = [6, 7, 8, 9, 10];
  // stars 0 to 3, null means the room has not been visited yet
  var data = {
    '6x6': 3, '6x7': 3, '6x8': 2, '6x9': 2, '6x10': 3,
    '7x6': 3, '7x7': 2, '7x8': 2, '7x9': 1, '7x10': 3,
    '8x6': 2, '8x7': 2, '8x8': 1, '8x9': null, '8x10': 3,
    '9x6': 1, '9x7': 1, '9x8': null, '9x9': null, '9x10': 2,
    '10x6': 3, '10x7': 3, '10x8': 2, '10x9': null, '10x10': 3
  };
  var due = { '7x7': 1, '8x7': 1, '9x7': 1, '6x9': 1 };

  var map = document.getElementById('map');
  map.appendChild(cell('axis', ''));
  nums.forEach(function (n) { map.appendChild(cell('axis', String(n))); });

  nums.forEach(function (a) {
    map.appendChild(cell('axis', String(a)));
    nums.forEach(function (b) {
      var key = a + 'x' + b;
      var stars = data[key];
      var room = document.createElement('div');
      room.className = 'room' + (stars === null ? ' locked' : '');
      if (stars === null) {
        room.innerHTML = '<span>' + a + ' × ' + b + '</span><i class="lock"></i>';
      } else {
        var pips = '<div class="pips">';
        for (var i = 0; i < 3; i++) pips += '<i class="star' + (i < stars ? '' : ' off') + '"></i>';
        pips += '</div>';
        room.innerHTML = '<span>' + a + ' × ' + b + '</span>' + pips + (due[key] ? '<i class="clock"></i>' : '');
      }
      map.appendChild(room);
    });
  });

  function cell(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    return d;
  }

  var badges = [
    ['First 56', true], ['Perfect Session', true], ['Streak 5', true], ['No Hints', false],
    ['Both Hands', true], ['Speed', false], ['Comeback', false]
  ];
  var shelf = document.getElementById('shelf');
  badges.forEach(function (b) {
    var el = document.createElement('div');
    el.className = 'badge' + (b[1] ? ' on' : '');
    el.innerHTML = '<div class="medal"><i class="star"></i></div><span>' + b[0] + '</span>';
    shelf.appendChild(el);
  });
})();
</script>
</body>
</html>
