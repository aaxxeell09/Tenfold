<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Tenfold · Tally</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.tablet{height:100vh;overflow:hidden;background:var(--polar);display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;flex:none;width:1194px;height:834px;overflow:hidden;background:var(--snow);
    transform:scale(var(--fit,1));transform-origin:center center;
    display:grid;grid-template-columns:512px minmax(0,1fr);
  }
  .back{
    position:absolute;top:24px;left:24px;z-index:3;width:60px;height:60px;border:2px solid var(--swan);
    border-radius:20px;background:var(--snow);box-shadow:0 4px 0 var(--swan);color:var(--wolf);
    display:flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .back svg{width:28px;height:28px}
  .back:active{transform:translateY(4px);box-shadow:0 0 0 var(--swan)}

  .left{
    background:var(--polar);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:70px 48px 48px;text-align:center;
  }
  .tally{display:block;line-height:0;width:300px}
  .tally svg{display:block;width:100%;height:auto;overflow:visible}
  .lname{margin:0;font-size:38px;font-weight:900;color:var(--eel)}
  .lsub{margin:0;font-size:17px;font-weight:800;color:var(--hare);letter-spacing:.8px;text-transform:uppercase}
  .xpwrap{width:100%;max-width:360px}
  .xprow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;font-size:16px;font-weight:800;color:var(--wolf)}
  .track{position:relative;height:20px;border-radius:10px;background:var(--swan);overflow:hidden}
  .track i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:var(--green)}
  .nextline{margin:0;font-size:16px;font-weight:700;color:var(--wolf)}

  .right{padding:74px 52px 34px;display:flex;flex-direction:column;min-height:0}
  .right h2{margin:0 0 3px;font-size:26px;font-weight:900;color:var(--eel)}
  .right .hint{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--wolf)}
  .list{display:flex;flex-direction:column;gap:7px}
  .row{
    display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:14px;
    border:2px solid var(--swan);background:var(--snow);
  }
  .row .no{
    width:32px;height:32px;flex:none;border-radius:50%;background:var(--swan);color:#9a9a9a;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;
  }
  .row .nm{font-size:18px;font-weight:800;color:#a9a9a9}
  .row .tag{margin-left:auto;font-size:14px;font-weight:800;color:#b5b5b5}
  .row.got{border-color:var(--green);background:var(--green-soft)}
  .row.got .no{background:var(--green);color:var(--snow)}
  .row.got .nm{color:var(--green-lip)}
  .row.got .tag{color:var(--green-lip)}
  .row.now{border-color:var(--green);background:var(--snow);box-shadow:0 4px 0 var(--green)}
  .row.now .no{background:var(--green);color:var(--snow)}
  .row.now .nm{color:var(--eel)}
  .row.now .tag{color:var(--green-lip)}
</style>
</head>
<body class="tablet">
<div class="frame">

  <a class="back" href="hub.html" aria-label="Back">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M 28 12 L 16 24 L 28 36" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </a>

  <section class="left">
    <div class="tally" id="big" data-tally="happy"></div>
    <p class="lsub">Level <span id="lnum">2</span> of 10</p>
    <h1 class="lname" id="lname">Finger Counter</h1>
    <div class="xpwrap">
      <div class="xprow"><span>XP to next level</span><b id="lxp">60 / 150</b></div>
      <div class="track"><i id="lfill" style="width:40%"></i></div>
    </div>
    <p class="nextline" id="nextline">Next: Tip Toucher</p>
  </section>

  <section class="right">
    <h2>Tally's levels</h2>
    <p class="hint">Every second level he gets something new to wear.</p>
    <div class="list" id="list"></div>
  </section>

</div>

<script src="levels.js"></script>
<script src="tally.js"></script>
<script>
(function () {
  var i = TF.info();
  document.getElementById('lnum').textContent = i.level;
  document.getElementById('lname').textContent = i.name;
  document.getElementById('lxp').textContent = i.next ? i.inLevel + ' / ' + i.span : 'Complete';
  document.getElementById('lfill').style.width = i.percent + '%';
  document.getElementById('nextline').textContent = i.next ? 'Next: ' + i.next : 'Top level reached.';

  var names = { glasses: 'Glasses', headband: 'Headband', hat: 'Wizard hat', cape: 'Cape', crown: 'Crown' };
  document.getElementById('list').innerHTML = TF.LEVELS.map(function (name, k) {
    var lvl = k + 1;
    var cls = lvl < i.level ? 'got' : lvl === i.level ? 'now' : '';
    var acc = TF.ACC[lvl];
    var tag = lvl === i.level ? 'You are here' : acc ? names[acc] : '';
    return '<div class="row ' + cls + '"><span class="no">' + lvl + '</span>' +
           '<span class="nm">' + name + '</span>' +
           '<span class="tag">' + tag + '</span></div>';
  }).join('');

  if (window.Tally) window.Tally.set(document.getElementById('big'), 'happy', i.accessories);

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
