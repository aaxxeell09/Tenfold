<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, initial-scale=1">
<title>Tenfold · Start check</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{width:auto;height:auto;overflow:auto;display:block;background:#ece7dd}
  .sheet{display:flex;flex-direction:column;align-items:center;gap:34px;padding:34px 0 60px}
  .frameblock{display:flex;flex-direction:column;gap:10px}
  .flabel{margin:0;font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a8172}
  .frame{
    position:relative;width:1194px;height:834px;flex:none;overflow:hidden;border-radius:22px;
    transform:scale(var(--fs,1));transform-origin:top left;
  }
  .frameblock{width:calc(1194px * var(--fs,1));height:calc(834px * var(--fs,1) + 30px)}

  /* camera fills the screen */
  .cam{position:absolute;inset:0;width:auto;height:auto;aspect-ratio:auto;border-radius:0;background:#2b2724;overflow:hidden}
  .camtag{
    position:absolute;top:26px;left:32px;font-size:15px;font-weight:800;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(250,247,242,.42);
  }
  .stepnum{
    position:absolute;top:24px;right:32px;display:flex;gap:9px;align-items:center;
  }
  .stepnum i{width:11px;height:11px;border-radius:50%;background:rgba(250,247,242,.28)}
  .stepnum i.on{background:#f4f0e8}

  .stage{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .5s ease}
  .frame.leaving .stage{transform:translateX(-120px);opacity:0}

  /* dashed hand zones */
  .zone{
    position:absolute;width:360px;height:420px;border-radius:64px;
    border:5px dashed rgba(250,247,242,.34);
    transition:border-color .4s ease,background-color .4s ease,border-style .1s linear;
  }
  .zone.l{left:170px;top:250px}
  .zone.r{left:664px;top:250px}
  .frame.detected .zone{border-style:solid;border-color:rgba(250,247,242,.8);background:rgba(250,247,242,.06)}

  /* ghost hands */
  .gh{position:absolute;inset:0;width:100%;height:100%}
  .gh .handline{fill:rgba(250,247,242,.05);stroke:rgba(250,247,242,.32);stroke-width:5;stroke-linejoin:round;transition:fill .45s ease,stroke .45s ease}
  .frame.detected .gh .handline{fill:rgba(250,247,242,.1);stroke:rgba(250,247,242,.72)}
  .gh .hand{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
  .gh .tip{fill:rgba(250,247,242,.12);stroke:rgba(250,247,242,.3);stroke-width:3;transition:fill .3s ease,stroke .3s ease}
  .gh .num{fill:rgba(250,247,242,.5);font-family:Nunito,Helvetica,sans-serif;font-size:23px;font-weight:800;text-anchor:middle;transition:fill .3s ease}
  .gh .halo{fill:none}
  .gh .fin{transition:transform .5s cubic-bezier(.3,.7,.3,1)}
  .gh .fin.lit .tip{fill:#f4f0e8;stroke:#ffffff}
  .gh .fin.lit .num{fill:#33302b}
  .gh .fin.glow .tip{fill:#dcecca;stroke:#a9cc86}
  .gh .fin.glow .num{fill:#2f5518}
  .gh .fin.glow .halo{fill:rgba(63,125,42,.26);animation:halo 1.2s ease-in-out infinite}
  @keyframes halo{0%,100%{r:34px}50%{r:46px}}
  .frame.touching .gh .fin.glow .halo{animation:none;r:42px}
  .frame.matched .gh .fin.glow .tip{fill:#3f7d2a;stroke:#2f5e1e}
  .frame.matched .gh .fin.glow .num{fill:#ffffff}
  .frame.matched .gh .fin.glow .halo{fill:rgba(63,125,42,.4)}

  /* green banner */
  .banner-top{
    position:absolute;left:0;right:0;top:0;padding:26px 40px;background:#dcecca;color:#2f5518;
    font-size:38px;font-weight:800;text-align:center;
    transform:translateY(-100%);transition:transform .4s cubic-bezier(.3,.7,.3,1);
  }
  .frame.banner .banner-top{transform:none}

  /* the answer, said out loud */
  .result{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:230px;font-weight:800;color:#f4f0e8;letter-spacing:-.02em;
    opacity:0;transform:scale(.7);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.5,.4,1);
  }
  .frame.result .result{opacity:1;transform:none}

  /* microphone */
  .mic{
    position:absolute;right:44px;bottom:56px;display:flex;align-items:center;gap:14px;
    height:74px;padding:0 26px;border-radius:24px;background:rgba(250,247,242,.1);
    border:3px solid rgba(250,247,242,.26);color:#f4f0e8;
    font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  }
  .mic svg{width:28px;height:28px;color:#dcecca}
  .mic .bars{display:flex;align-items:center;gap:5px;height:30px}
  .mic .bars i{width:6px;height:10px;border-radius:3px;background:#dcecca;animation:mic 800ms ease-in-out infinite}
  .mic .bars i:nth-child(2){animation-delay:120ms}
  .mic .bars i:nth-child(3){animation-delay:240ms}
  .mic .bars i:nth-child(4){animation-delay:360ms}
  @keyframes mic{0%,100%{height:9px}50%{height:28px}}
  .frame.heard .mic{border-color:#3f7d2a;background:rgba(63,125,42,.22)}
  .frame.heard .mic .bars i{animation:none;height:9px;background:#f4f0e8}

  /* the big check that pops for one second */
  .bigcheck{
    position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
    border-radius:50%;background:#3f7d2a;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.4);
  }
  .bigcheck svg{width:130px;height:130px}
  .frame.check .bigcheck{animation:pop 1s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:scale(.4)}
    22%{opacity:1;transform:scale(1.06)}
    36%{transform:scale(1)}
    78%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.1)}
  }

  /* Tally, bottom left, one short sentence */
  .tallywrap{position:absolute;left:44px;bottom:44px;display:flex;align-items:flex-end;gap:20px}
  .tallywrap .tally{width:132px;flex:none}
  .tbubble{
    position:relative;margin-bottom:22px;max-width:520px;padding:20px 26px;border-radius:26px;
    background:#faf7f2;color:#33302b;font-size:29px;font-weight:700;line-height:1.2;
    transition:background-color .3s ease,color .3s ease;
  }
  .tbubble::after{
    content:"";position:absolute;left:-9px;bottom:22px;width:20px;height:20px;background:inherit;
    transform:rotate(45deg);border-radius:4px;
  }
  .frame.matched .tbubble,.frame.heard .tbubble{background:#dcecca;color:#2f5518}

  /* the practice map sliding in */
  .mapslide{
    position:absolute;right:0;top:0;bottom:0;width:392px;padding:44px 36px;background:#faf7f2;
    transform:translateX(100%);transition:transform .6s cubic-bezier(.3,.7,.3,1);
  }
  .frame.mapin .mapslide{transform:none}
  .mapslide h3{margin:0 0 6px;font-size:26px;font-weight:800;color:#33302b}
  .mapslide p{margin:0 0 30px;font-size:17px;font-weight:600;color:#6f6859}
  .mapslide svg{display:block;width:100%;height:auto}
  .mapslide .track{fill:none;stroke:#e2dbcd;stroke-width:7;stroke-linecap:round;stroke-dasharray:2 16}
  .mapslide text{font-family:Nunito,Helvetica,sans-serif;font-size:17px;font-weight:800;fill:#6f6859}
</style>
</head>
<body>

<div class="sheet" id="sheet">

  <div class="frameblock">
    <p class="flabel">Step 1 · Show me both hands</p>
    <div class="frame" id="f1" data-step="1">
      <div class="cam">
        <span class="camtag">camera</span>
        <div class="stepnum"><i class="on"></i><i></i><i></i></div>
        <div class="stage">
          <div class="zone l"></div>
          <div class="zone r"></div>
        </div>
        <div class="bigcheck"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M 11 25 L 20 34 L 37 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
        <div class="tallywrap">
          <div class="tally" data-tally="ready"></div>
          <div class="tbubble" id="say1">Show me both hands.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="frameblock">
    <p class="flabel">Step 2 · Touch your 6 with your 6</p>
    <div class="frame" id="f2" data-step="2">
      <div class="cam">
        <span class="camtag">camera</span>
        <div class="stepnum"><i></i><i class="on"></i><i></i></div>
        <div class="banner-top">That is a 6 and a 6.</div>
        <div class="stage">
          <div class="zone l"></div>
          <div class="zone r"></div>
        </div>
        <div class="bigcheck"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M 11 25 L 20 34 L 37 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
        <div class="tallywrap">
          <div class="tally" data-tally="thinking"></div>
          <div class="tbubble" id="say2">Touch your 6 with your 6.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="frameblock">
    <p class="flabel">Step 3 · Say the answer</p>
    <div class="frame" id="f3" data-step="3">
      <div class="cam">
        <span class="camtag">camera</span>
        <div class="stepnum"><i></i><i></i><i class="on"></i></div>
        <div class="stage">
          <div class="zone l"></div>
          <div class="zone r"></div>
        </div>
        <div class="result">36</div>
        <div class="mic">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#icon-mic"></use></svg>
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span id="miclabel">Listening</span>
        </div>
        <div class="bigcheck"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M 11 25 L 20 34 L 37 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
        <div class="tallywrap">
          <div class="tally" data-tally="ready"></div>
          <div class="tbubble" id="say3">Say the answer.</div>
        </div>
        <div class="mapslide">
          <h3>Your practice path</h3>
          <p>Three units, one finger trick at a time.</p>
          <svg viewBox="0 0 320 420" aria-hidden="true">
            <path class="track" d="M 60 40 Q 190 80 150 150 Q 118 210 70 250 Q 30 300 170 350"></path>
            <circle cx="60" cy="44" r="22" fill="#255a56"></circle>
            <circle cx="60" cy="40" r="22" fill="#2f6f6a"></circle>
            <circle cx="150" cy="154" r="22" fill="#c9c0ae"></circle>
            <circle cx="150" cy="150" r="22" fill="#e2dbcd"></circle>
            <circle cx="70" cy="254" r="22" fill="#c9c0ae"></circle>
            <circle cx="70" cy="250" r="22" fill="#e2dbcd"></circle>
            <text x="94" y="47">Meet your fingers</text>
            <text x="184" y="157">Count the tens</text>
            <text x="104" y="257">Big numbers</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="tally.js"></script>
<script>
(function () {
  // one traced hand outline per zone, with a numbered circle at each fingertip
  var HAND = 'M 64 430 C 58 392 48 336 38 288 C 30 250 22 216 22 192 A 22 22 0 0 1 66 192 ' +
    'L 74 250 C 74 226 72 150 72 120 A 24 24 0 0 1 120 120 ' +
    'L 126 232 C 126 208 125 122 125 93 A 25 25 0 0 1 175 93 ' +
    'L 180 236 C 180 212 180 142 180 118 A 24 24 0 0 1 228 118 ' +
    'L 238 262 C 232 282 216 296 205 308 L 269 227 A 22 22 0 0 1 303 254 ' +
    'L 239 335 C 232 346 224 354 216 366 C 210 390 206 410 204 430 Z';
  // numbers sit just outside the four fingertips, and on the thumb tip itself
  var TIPS = [[10, 44, 134], [9, 96, 60], [8, 150, 32], [7, 204, 58], [6, 286, 240]];
  var S = 0.95, TOP = 254;

  function handSvg(side, originX) {
    var flip = side === 'left' ? 1 : -1;
    var out = '<g class="hand" data-hand="' + side + '">' +
      '<g transform="translate(' + originX + ',' + TOP + ') scale(' + (flip * S) + ',' + S + ')">' +
        '<path class="handline" d="' + HAND + '"></path>' +
      '</g>';
    TIPS.forEach(function (t) {
      var x = originX + flip * S * t[1];
      var y = TOP + S * t[2];
      out += '<g class="fin" data-hand="' + side + '" data-n="' + t[0] + '" transform="translate(' + x + ',' + y + ')">' +
               '<circle class="halo" r="34"></circle>' +
               '<circle class="tip" r="28"></circle>' +
               '<text class="num" y="8">' + t[0] + '</text>' +
             '</g>';
    });
    return out + '</g>';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.stage'), function (stage) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'gh');
    svg.setAttribute('viewBox', '0 0 1194 834');
    svg.innerHTML = handSvg('left', 185) + handSvg('right', 1009);
    stage.appendChild(svg);
  });

  function nums(frame) { return Array.prototype.slice.call(frame.querySelectorAll('.fin')); }
  function clear(frame) {
    frame.className = 'frame';
    nums(frame).forEach(function (n) { n.setAttribute('class', 'fin'); });
    Array.prototype.forEach.call(frame.querySelectorAll('.hand'), function (h) { h.removeAttribute('transform'); });
  }
  function tally(frame, face) {
    var host = frame.querySelector('.tally');
    if (window.Tally) window.Tally.set(host, face);
  }
  function run(steps, frame, period) {
    var timers = [];
    function cycle() {
      timers.forEach(clearTimeout);
      timers = steps.map(function (s) {
        return setTimeout(function () { s[1](frame); }, s[0]);
      });
    }
    cycle();
    setInterval(cycle, period);
  }

  /* Step 1: both hands detected, then the numbers light up one by one */
  var f1 = document.getElementById('f1');
  var step1 = [
    [0, function (f) { clear(f); tally(f, 'ready'); document.getElementById('say1').textContent = 'Show me both hands.'; }],
    [900, function (f) { f.classList.add('detected'); document.getElementById('say1').textContent = 'There they are.'; }]
  ];
  [10, 9, 8, 7, 6].forEach(function (n, i) {
    step1.push([1300 + i * 300, function (f) {
      nums(f).filter(function (el) { return Number(el.getAttribute('data-n')) === n; }).forEach(function (el) { el.classList.add('lit'); });
    }]);
  });
  step1.push([3100, function (f) { f.classList.add('check'); tally(f, 'happy'); }]);
  step1.push([4200, function (f) { f.classList.add('leaving'); }]);

  /* Step 2: both thumbs glow, then touch */
  var f2 = document.getElementById('f2');
  var step2 = [
    [0, function (f) {
      clear(f); f.classList.add('detected'); tally(f, 'thinking');
      document.getElementById('say2').textContent = 'Touch your 6 with your 6.';
      nums(f).filter(function (el) { return el.getAttribute('data-n') === '6'; }).forEach(function (el) { el.classList.add('glow'); });
    }],
    [1400, function (f) {
      f.classList.add('touching');
      Array.prototype.forEach.call(f.querySelectorAll('.hand'), function (h) {
        h.setAttribute('transform', h.getAttribute('data-hand') === 'left' ? 'translate(112,0)' : 'translate(-112,0)');
      });
    }],
    [2000, function (f) {
      f.classList.add('matched', 'banner', 'check');
      tally(f, 'happy');
      document.getElementById('say2').textContent = 'Six and six, touching.';
    }],
    [3400, function (f) { f.classList.add('leaving'); }]
  ];

  /* Step 3: the answer is heard, then the practice map slides in */
  var f3 = document.getElementById('f3');
  var step3 = [
    [0, function (f) {
      clear(f); f.classList.add('detected'); tally(f, 'ready');
      document.getElementById('say3').textContent = 'Say the answer.';
      document.getElementById('miclabel').textContent = 'Listening';
      nums(f).filter(function (el) { return el.getAttribute('data-n') === '6'; }).forEach(function (el) { el.classList.add('glow'); });
    }],
    [1600, function (f) {
      f.classList.add('heard', 'result');
      document.getElementById('miclabel').textContent = 'Thirty six';
      document.getElementById('say3').textContent = 'Thirty six. Exactly.';
      tally(f, 'happy');
    }],
    [2700, function (f) { f.classList.add('check'); }],
    [3700, function (f) {
      f.classList.add('mapin');
      document.getElementById('say3').textContent = 'Your path is open.';
    }]
  ];

  function fit() {
    var s = Math.min(1, (window.innerWidth - 48) / 1194);
    document.documentElement.style.setProperty('--fs', s);
  }
  window.addEventListener('resize', fit);
  fit();

  setTimeout(function () {
    run(step1, f1, 5600);
    run(step2, f2, 5000);
    run(step3, f3, 6000);
  }, 420);
})();
</script>
</body>
</html>
