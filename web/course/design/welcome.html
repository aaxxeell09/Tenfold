<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Nimble · Welcome</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lesson.css">
</head>
<body class="tablet">
<div class="frame">

  <section class="centered welcome">
    <div class="stack">
      <img class="logo" src="logo.png" alt="Nimble, learn math with your hands.">
      <h1>Hi! I am Tally. What is your name?</h1>

      <form id="form" autocomplete="off">
        <input class="field" id="name" type="text" maxlength="14" placeholder="Your first name" aria-label="Your first name" style="text-align:center">
        <button class="btn btn-wide btn-xl" type="submit">Let's go</button>
      </form>
    </div>
  </section>

</div>

<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('name');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = (input.value || '').trim();
    if (name) localStorage.setItem('tenfold.name', name);
    window.location.href = 'hub.html';
  });
  input.focus();

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
