<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Nimble · Tutor states</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* gallery styles are namespaced nb- so they never collide with the app styles */
  html,body{background:var(--polar);height:auto;overflow:auto}
  .nb-page{max-width:1060px;margin:0 auto;padding:34px 28px 80px}

  .nb-head{display:flex;align-items:center;gap:24px;margin-bottom:6px}
  .nb-logo{width:160px;height:54px;flex:none;display:block;background:url("logo.png") no-repeat center / contain}
  .nb-head h1{margin:0;font-size:27px;font-weight:900;color:var(--eel)}
  .nb-head p{margin:3px 0 0;font-size:15px;font-weight:700;color:var(--wolf)}
  .nb-warn{color:var(--red-lip)!important;font-weight:800!important}

  .nb-links{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 28px}
  .nb-links a{
    display:inline-flex;align-items:center;width:auto;height:44px;padding:0 18px;
    border:3px solid var(--swan);border-radius:14px;background:var(--snow);
    color:var(--eel);font-size:15px;font-weight:900;text-decoration:none;
  }
  .nb-links a:hover{border-color:var(--green);color:var(--green-lip)}

  .nb-grid{display:grid;grid-template-columns:1fr;gap:22px}

  /* ---------- one state card ---------- */
  .nb-card{background:var(--snow);border-radius:24px;padding:13px 14px 13px;box-shadow:0 0 0 2px var(--swan) inset}

  .nb-label{display:flex;align-items:baseline;gap:10px;margin:0 2px 6px}
  .nb-label b{font-size:15px;font-weight:900;color:var(--eel);letter-spacing:.6px;text-transform:uppercase}
  .nb-label span{font-size:13px;font-weight:800;color:var(--hare)}

  /* muted strip: counter and XP are never spoken */
  .nb-strip{display:flex;align-items:center;gap:12px;margin:0 2px 6px}
  .nb-ct{font-size:12px;font-weight:900;color:var(--hare);letter-spacing:.9px;text-transform:uppercase}
  .nb-rail{flex:1;height:8px;border-radius:4px;background:var(--swan);overflow:hidden}
  .nb-rail i{display:block;height:100%;border-radius:4px;background:var(--green)}
  .nb-xp{font-size:12px;font-weight:900;color:var(--hare);letter-spacing:.6px}
  .nb-gain{
    padding:3px 9px;border-radius:9px;background:var(--green-soft);color:var(--green-lip);
    font-size:12px;font-weight:900;animation:nb-gain 1.6s ease-out both;
  }
  @keyframes nb-gain{0%{opacity:0;transform:translateY(7px)}22%{opacity:1;transform:none}100%{opacity:1}}
  .nb-solo{padding:3px 9px;border-radius:9px;background:var(--swan);color:var(--wolf);font-size:12px;font-weight:900}

  .nb-body{display:flex;gap:16px;align-items:stretch}

  /* ---------- the camera owns the card ---------- */
  .nb-cam{position:relative;flex:1;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#242a45}
  .nb-cam.nb-dark::after{content:"";position:absolute;inset:0;background:rgba(16,20,38,.6)}
  .nb-camtag{
    position:absolute;top:11px;left:14px;z-index:3;font-size:10px;font-weight:900;letter-spacing:1.5px;
    text-transform:uppercase;color:rgba(255,255,255,.42);
  }
  .nb-cam svg{position:absolute;inset:0;width:100%;height:100%}

  .nb-hand{fill:rgba(255,255,255,.09);stroke:rgba(255,255,255,.62);stroke-width:5;stroke-linejoin:round}
  .nb-hand.nb-off{stroke:var(--orange);stroke-width:9;fill:rgba(247,148,51,.12)}
  .nb-tip{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.3);stroke-width:3}
  .nb-num{fill:#fff;font-family:var(--font);font-size:26px;font-weight:900;text-anchor:middle}

  /* every aid is drawn on the finger points, inside the picture */
  .nb-dot{fill:var(--green);stroke:#fff;stroke-width:4}
  .nb-glow{fill:rgba(47,174,130,.3);stroke:var(--green);stroke-width:4}
  .nb-pulse{fill:rgba(47,174,130,.4);stroke:var(--green);stroke-width:5;animation:nb-pulse 1.4s ease-in-out infinite}
  @keyframes nb-pulse{0%,100%{r:34px;opacity:.85}50%{r:54px;opacity:1}}
  .nb-link{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;stroke-dasharray:14 12;animation:nb-crawl 1s linear infinite}
  .nb-arc{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;stroke-dasharray:16 13;animation:nb-crawl 1.1s linear infinite}
  @keyframes nb-crawl{to{stroke-dashoffset:-52}}
  .nb-target{fill:none;stroke:var(--green);stroke-width:6;stroke-dasharray:12 10}
  .nb-ghost{fill:rgba(255,255,255,.42);stroke:#fff;stroke-width:4;stroke-dasharray:9 8}
  .nb-zone{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.5);stroke-width:6;stroke-dasharray:22 18}

  /* ---------- Tally is the only voice ---------- */
  .nb-tally{display:flex;align-items:center;gap:0;margin-top:6px}
  .nb-mascot{
    width:78px;height:84px;flex:none;background:url("art/hand2.png") no-repeat center / contain;
    animation:nb-bob 3.2s ease-in-out infinite;
  }
  @keyframes nb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .nb-say{
    position:relative;margin:0 0 0 -6px;min-height:72px;flex:0 1 auto;max-width:470px;
    background:url("art/bubble-box.png") no-repeat center / 100% 100%;padding:14px 16px 16px 32px;
    color:var(--eel);font-size:17px;font-weight:800;line-height:1.26;display:flex;align-items:center;
  }
  .nb-watch{
    display:flex;align-items:center;gap:7px;margin-left:8px;font-size:13px;font-weight:900;
    color:var(--hare);letter-spacing:.8px;text-transform:uppercase;
  }
  .nb-watch i{width:8px;height:8px;border-radius:50%;background:var(--hare);animation:nb-blink 1.4s ease-in-out infinite}
  .nb-watch i:nth-child(2){animation-delay:.2s}
  .nb-watch i:nth-child(3){animation-delay:.4s}
  @keyframes nb-blink{0%,100%{opacity:.25}50%{opacity:1}}

  /* ---------- rescue card: beside the frame, never over the hands ---------- */
  .nb-rescue{
    margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-radius:16px;background:var(--polar);box-shadow:0 0 0 2px var(--swan) inset;
  }
  .nb-rescue b{
    writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:900;color:var(--hare);
    letter-spacing:1px;text-transform:uppercase;
  }
  .nb-step{
    display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;background:var(--snow);
    box-shadow:0 0 0 2px var(--swan) inset;font-size:15px;font-weight:900;color:var(--eel);white-space:nowrap;
  }
  .nb-step em{
    font-style:normal;width:20px;height:20px;flex:none;border-radius:50%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;
  }

  .nb-note{margin:6px 2px 0;font-size:13px;font-weight:700;color:var(--hare);line-height:1.3}
</style>
</head>
<body>
<div class="nb-page">

  <div class="nb-head">
    <span class="nb-logo" role="img" aria-label="Nimble"></span>
    <div>
      <h1>Tutor states</h1>
      <p>One dressing of the same camera frame per state the tutor can send. Tally's bubble is the only voice.</p>
      <p class="nb-warn">State names on these cards are spec labels for the team. They never appear in the child app.</p>
    </div>
  </div>

  <div class="nb-links">
    <a href="welcome.html">Welcome</a>
    <a href="hub.html">Home</a>
    <a href="practice.html">Path</a>
    <a href="check.html">Check</a>
    <a href="exercise.html">Exercise</a>
    <a href="finish.html">Finish</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="nb-grid" id="grid"></div>

</div>

<script>
(function () {
  // ---- hand geometry: one traced hand per side, a point at every fingertip ----
  var HAND = 'M 64 430 C 58 392 48 336 38 288 C 30 250 22 216 22 192 A 22 22 0 0 1 66 192 ' +
    'L 74 250 C 74 226 72 150 72 120 A 24 24 0 0 1 120 120 ' +
    'L 126 232 C 126 208 125 122 125 93 A 25 25 0 0 1 175 93 ' +
    'L 180 236 C 180 212 180 142 180 118 A 24 24 0 0 1 228 118 ' +
    'L 238 262 C 232 282 216 296 205 308 L 269 227 A 22 22 0 0 1 303 254 ' +
    'L 239 335 C 232 346 224 354 216 366 C 210 390 206 410 204 430 Z';
  var TIPS = { 10: [44, 192], 9: [96, 120], 8: [150, 93], 7: [204, 118], 6: [286, 241] };
  var VW = 1194, VH = 672, S = 1.2, TOP = 72;
  var ORIGIN = { left: 188, right: 1006 };
  var PIVOT = {
    left: { x: ORIGIN.left + S * 130, y: TOP + S * 430 },
    right: { x: ORIGIN.right - S * 130, y: TOP + S * 430 }
  };
  var CLOSE_ROT = { left: 22, right: -20 }, GAP = 50;

  function base(hand, n) {
    var flip = hand === 'left' ? 1 : -1;
    return { x: ORIGIN[hand] + flip * S * TIPS[n][0], y: TOP + S * TIPS[n][1] };
  }
  function spin(p, piv, deg) {
    var r = deg * Math.PI / 180, c = Math.cos(r), s2 = Math.sin(r);
    var dx = p.x - piv.x, dy = p.y - piv.y;
    return { x: piv.x + dx * c - dy * s2, y: piv.y + dx * s2 + dy * c };
  }
  // each hand gets a wrist rotation, then the right hand is slid so the pair meets tip to tip
  function xform(spec) {
    if (!spec.close) return { left: { rot: 0, tx: 0, ty: 0 }, right: { rot: 0, tx: 0, ty: 0 } };
    var pair = spec.pair || (spec.glow && spec.glow.length === 2 ? spec.glow : ['left6', 'right7']);
    var a = pair[0].match(/^(left|right)(\d+)$/), b = pair[1].match(/^(left|right)(\d+)$/);
    var at1 = spin(base(a[1], a[2]), PIVOT[a[1]], CLOSE_ROT.left);
    var at2 = spin(base(b[1], b[2]), PIVOT[b[1]], CLOSE_ROT.right);
    return {
      left: { rot: CLOSE_ROT.left, tx: 0, ty: 0 },
      right: { rot: CLOSE_ROT.right, tx: (at1.x + GAP) - at2.x, ty: at1.y - at2.y }
    };
  }
  function at(k, X) {
    var m = k.match(/^(left|right)(\d+)$/), t = X[m[1]];
    var p = spin(base(m[1], m[2]), PIVOT[m[1]], t.rot);
    return { x: p.x + t.tx, y: p.y + t.ty };
  }

  function handSvg(hand, spec, X) {
    var flip = hand === 'left' ? 1 : -1, t = X[hand];
    var off = spec.off === hand ? ' nb-off' : '';
    var out = '<g transform="translate(' + t.tx + ',' + t.ty + ') rotate(' + t.rot + ' ' + PIVOT[hand].x + ' ' + PIVOT[hand].y + ')">' +
      '<g transform="translate(' + ORIGIN[hand] + ',' + TOP + ') scale(' + (flip * S) + ',' + S + ')">' +
        '<path class="nb-hand' + off + '" d="' + HAND + '"></path></g>';
    Object.keys(TIPS).forEach(function (n) {
      var p = base(hand, n);
      out += '<g transform="translate(' + p.x + ',' + p.y + ')">' +
             '<circle class="nb-tip" r="25"></circle>' +
             (spec.numbers ? '<text class="nb-num" y="10">' + n + '</text>' : '') +
             '</g>';
    });
    return out + '</g>';
  }

  function aids(spec, X) {
    var out = '';
    var pair = spec.close ? (spec.pair || (spec.glow && spec.glow.length === 2 ? spec.glow : null)) : null;
    if (pair) {
      pair.forEach(function (k) {
        var p = at(k, X);
        out += '<circle class="nb-tip" cx="' + p.x + '" cy="' + p.y + '" r="25"></circle>';
      });
      var c1 = at(pair[0], X), c2 = at(pair[1], X);
      out += '<line stroke="#2fae82" stroke-width="9" stroke-linecap="round" x1="' + c1.x + '" y1="' + c1.y +
             '" x2="' + c2.x + '" y2="' + c2.y + '"></line>';
    }
    (spec.glow || []).forEach(function (k) {
      var p = at(k, X);
      out += '<circle class="nb-glow" cx="' + p.x + '" cy="' + p.y + '" r="44"></circle>';
    });
    (spec.pulse || []).forEach(function (k) {
      var p = at(k, X);
      out += '<circle class="nb-pulse" cx="' + p.x + '" cy="' + p.y + '" r="40"></circle>';
    });
    (spec.targets || []).forEach(function (k) {
      var p = at(k, X);
      out += '<circle class="nb-target" cx="' + p.x + '" cy="' + p.y + '" r="36"></circle>';
    });
    (spec.dots || []).forEach(function (k) {
      var p = at(k, X);
      out += '<circle class="nb-dot" cx="' + p.x + '" cy="' + p.y + '" r="19"></circle>';
    });
    if (spec.link) {
      var a = at(spec.link[0], X), b = at(spec.link[1], X);
      out += '<path class="nb-link" d="M ' + a.x + ' ' + a.y + ' Q ' +
             ((a.x + b.x) / 2) + ' ' + (Math.min(a.y, b.y) - 66) + ' ' + b.x + ' ' + b.y + '"></path>';
    }
    if (spec.arc) {
      var f = at(spec.arc[0], X), t = at(spec.arc[1], X);
      var mx = (f.x + t.x) / 2, my = Math.min(f.y, t.y) - 120;
      var ang = Math.atan2((t.y - 38) - my, t.x - mx) * 180 / Math.PI;
      out += '<path class="nb-arc" d="M ' + f.x + ' ' + (f.y - 34) + ' Q ' + mx + ' ' + my + ' ' + t.x + ' ' + (t.y - 38) + '"></path>' +
             '<polygon fill="#f79433" points="0,-13 26,0 0,13" transform="translate(' + t.x + ',' + (t.y - 38) + ') rotate(' + ang + ')"></polygon>' +
             '<circle class="nb-target" cx="' + t.x + '" cy="' + t.y + '" r="38"></circle>';
    }
    if (spec.ghost) {
      var g1 = at(spec.ghost[0], X), g2 = at(spec.ghost[1], X);
      out += '<circle class="nb-target" cx="' + g2.x + '" cy="' + g2.y + '" r="40"></circle>' +
             '<circle class="nb-ghost" r="24">' +
             '<animateTransform attributeName="transform" type="translate" ' +
             'values="' + g1.x + ' ' + g1.y + ';' + g2.x + ' ' + g2.y + ';' + g2.x + ' ' + g2.y + ';' + g1.x + ' ' + g1.y + '" ' +
             'keyTimes="0;0.55;0.82;1" dur="2.8s" repeatCount="indefinite"></animateTransform></circle>';
    }
    return out;
  }

  function zone(x) {
    return '<rect class="nb-zone" x="' + x + '" y="150" width="330" height="430" rx="62"></rect>';
  }

  function camera(spec) {
    var hands = spec.hands === undefined ? 'both' : spec.hands;
    var X = xform(spec);
    var inner = '';
    if (spec.zones === 'both' || spec.zones === 'left') inner += zone(150);
    if (spec.zones === 'both' || spec.zones === 'right') inner += zone(714);
    var order = spec.close ? ['right', 'left'] : ['left', 'right'];
    order.forEach(function (h) {
      if (hands === 'both' || hands === h) inner += handSvg(h, spec, X);
    });
    inner += aids(spec, X);
    return '<div class="nb-cam' + (spec.dark ? ' nb-dark' : '') + '">' +
             '<span class="nb-camtag">camera</span>' +
             '<svg viewBox="0 0 ' + VW + ' ' + VH + '" aria-hidden="true">' + inner + '</svg></div>';
  }

  function strip(spec) {
    var right = spec.gain ? '<span class="nb-gain">+' + spec.gain + ' XP</span>'
                          : '<span class="nb-xp">120 / 150 XP</span>';
    if (spec.solo) right += '<span class="nb-solo">on your own</span>';
    if (spec.chip) right += '<span class="nb-solo">' + spec.chip + '</span>';
    return '<div class="nb-strip"><span class="nb-ct">' + (spec.count || '2 of 5') + '</span>' +
           '<span class="nb-rail"><i style="width:' + (spec.progress || 40) + '%"></i></span>' + right + '</div>';
  }

  function voice(spec, extra) {
    var tail = extra || '';
    if (!spec.say) {
      return '<div class="nb-tally"><div class="nb-mascot"></div>' +
             '<span class="nb-watch"><i></i><i></i><i></i> watching</span>' + tail + '</div>';
    }
    return '<div class="nb-tally"><div class="nb-mascot"></div>' +
           '<p class="nb-say">' + spec.say + '</p>' + tail + '</div>';
  }

  function rescue() {
    return '<div class="nb-rescue"><b>Together</b>' +
      '<div class="nb-step"><em>1</em>5 tens = 50</div>' +
      '<div class="nb-step"><em>2</em>3 × 2 = 6</div>' +
      '<div class="nb-step"><em>3</em>50 + 6 = 56</div></div>';
  }

  function card(spec) {
    return '<section class="nb-card">' +
      '<div class="nb-label"><b>' + spec.id + '</b><span>' + spec.sub + '</span></div>' +
      strip(spec) +
      '<div class="nb-body">' + camera(spec) + '</div>' +
      voice(spec, spec.rescue ? rescue() : '') +
      (spec.note ? '<p class="nb-note">' + spec.note + '</p>' : '') +
      '</section>';
  }

  var STATES = [
    { id: 'Prompting', sub: 'the exercise is given',
      say: 'Show me 6 times 7 with your hands.',
      note: 'Nothing drawn on the hands yet. One sentence, then the tutor waits.' },

    { id: 'Working', sub: 'the child is searching',
      say: null,
      note: 'Muted state: the tutor sends no line at all. The watching dots are an indicator, never speech.' },

    { id: 'Wrong pose', sub: 'right hand is off',
      say: 'Your left hand is right. Find 7 on your right hand.',
      off: 'right', dots: ['right7'],
      note: 'Orange outline on the hand at fault, green point on the finger expected.' },

    { id: 'Wrong pose', sub: 'found, not touching',
      say: 'You found the fingers. Touch them together.',
      dots: ['left6', 'right7'], link: ['left6', 'right7'],
      note: 'Both points confirmed green, the dashed link says bring them together.' },

    { id: 'Show', sub: 'help level 3',
      say: 'Move this finger here.',
      ghost: ['right9', 'right7'], dots: ['left6'],
      note: 'A translucent ghost finger slides from where the finger is to where it belongs.' },

    { id: 'Pose ready', sub: 'pose held, number to come',
      say: 'You have the pose. Now count the tens.',
      close: true, glow: ['left6', 'right7'],
      note: 'Soft green halo on the two touching fingers, nothing else changes.' },

    { id: 'Nudge', sub: 'help level 1',
      say: 'Start by finding 6 on your left hand.',
      pulse: ['left6'],
      note: 'The expected finger pulses for one second. No ghost, no arrow.' },

    { id: 'Answer retry', sub: 'wrong number, pose kept',
      say: 'Keep the pose. Count the tens again.',
      close: true, glow: ['left6', 'right7'],
      note: 'The pose is never taken away from the child after a wrong answer.' },

    { id: 'Rescue', sub: 'help level 4, walking through',
      say: 'Let us do it together. Five fingers make 50, and three times two makes 6.',
      close: true, glow: ['left6', 'right7'], rescue: true,
      note: 'The long line is one moment. The bubble is built to hold two lines of it.' },

    { id: 'Rescue', sub: 'help level 4, the ask',
      say: 'Now say 56.',
      close: true, glow: ['left6', 'right7'], rescue: true,
      note: 'Second moment, sent only after the walk through. One short sentence, then Tally waits.' },

    { id: 'Visibility', sub: 'no hands',
      say: 'Bring both hands into the camera.',
      hands: 'none', zones: 'both',
      note: 'Two dashed placement zones show where to hold the hands.' },

    { id: 'Visibility', sub: 'one hand',
      say: 'I can see one hand. Show me both.',
      hands: 'left', zones: 'right',
      note: 'The hand that is seen stays drawn, the missing one becomes a zone.' },

    { id: 'Success', sub: 'answer accepted',
      say: 'Yes. Seven times eight is 56.',
      close: true, glow: ['left6', 'right7'], dots: ['left6', 'right7'], gain: 12, progress: 60,
      note: 'XP is added quietly in the muted strip. Tally says it once.' },

    { id: 'Conversation', sub: 'the child asked Tally a question',
      say: 'A ten is five fingers down. Ask me again any time.',
      chip: 'timers on hold',
      note: 'Same camera, no aid added. Timers pause while Tally answers, then the tutor returns to the state it came from.' },

    { id: 'Answer before pose', sub: 'right number, pose not shown',
      say: 'That is the right answer. Now show me with your hands.',
      targets: ['left6', 'right7'], chip: 'no XP yet',
      note: 'Not a full success until the pose is seen. The two expected fingers are ringed, not filled green.' },

    { id: 'Speech unclear', sub: 'the microphone missed it',
      say: 'I did not catch that. Say the number again.',
      close: true, glow: ['left6', 'right7'], chip: 'no penalty',
      note: 'A failed recognition must never read as a wrong answer. The pose is kept, nothing is counted against the child.' },

    { id: 'Paused', sub: 'child stepped away',
      say: 'I will wait here. Come back when you are ready.',
      dark: true,
      note: 'Frame dimmed, no aid running, nothing asks for attention.' },

    { id: 'Supportive', sub: 'mode, first 3 seconds',
      say: 'Show me 6 times 7 with your hands.',
      numbers: true,
      note: 'The numbers 6 to 10 sit on the fingertips for the first three seconds, then fade.' },

    { id: 'Independent', sub: 'mode',
      say: 'Show me 6 times 7.',
      solo: true,
      note: 'Nothing extra on the hands, Tally is shorter, a muted pill marks the mode.' }
  ];

  document.getElementById('grid').innerHTML = STATES.map(card).join('');
})();
</script>
</body>
</html>
