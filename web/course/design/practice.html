<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Nimble · Practice</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.tablet{height:100vh;overflow:hidden;background:var(--polar);display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;flex:none;width:1194px;height:834px;overflow:hidden;background:var(--snow);
    transform:scale(var(--fit,1));transform-origin:center center;
    display:flex;flex-direction:column;padding:26px 34px 24px;gap:20px;
  }

  /* top bar */
  .top{display:flex;align-items:center;gap:18px;flex:none}
  .back{width:72px;height:72px;flex:none;display:block;transition:transform 60ms ease}
  .back img{width:100%;height:100%;display:block;object-fit:contain}
  .back:active{transform:translateY(3px)}
  .top h1{margin:0;font-size:26px;font-weight:900;color:var(--eel)}
  .top .sub{margin:2px 0 0;font-size:15px;font-weight:800;color:var(--hare);letter-spacing:.6px;text-transform:uppercase}
  .levelbox{
    margin-left:auto;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 8px;
    border:2px solid var(--swan);border-radius:16px;background:var(--snow);text-decoration:none;
  }
  .levelbox .avatar{width:36px;height:38px;flex:none;display:block;background:url("art/hand2.png") no-repeat center / contain}
  .lvl{min-width:190px}
  .lvl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .lvl-top b{font-size:15px;font-weight:900;color:var(--eel);white-space:nowrap}
  .lvl-top span{font-size:13px;font-weight:800;color:var(--hare);white-space:nowrap}
  .lvl-bar{height:9px}
  .lvl-bar i{background:var(--green)}

  /* body */
  .body{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;min-height:0}

  /* unit card */
  .unitcard{
    align-self:start;display:flex;flex-direction:column;gap:0;border-radius:26px;overflow:hidden;
    background:var(--snow);box-shadow:0 0 0 2px var(--swan) inset;
  }
  .unitcard .head{background:var(--unit);color:var(--snow);padding:16px 20px 18px;box-shadow:0 4px 0 var(--unit-lip)}
  .unitcard .kicker{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.9}
  .unitcard h2{margin:2px 0 3px;font-size:25px;font-weight:900;line-height:1.1}
  .unitcard .head p{margin:0;font-size:14px;font-weight:700;opacity:.92}
  .unitcard .mid{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px}
  .metric{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;color:var(--wolf)}
  .metric b{color:var(--eel);font-size:19px}
  .bar2{position:relative;height:16px;border-radius:8px;background:var(--swan);overflow:hidden}
  .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--unit)}
  .units{display:flex;gap:10px;padding:0 20px 16px}
  .units button{
    flex:1;height:56px;padding:0;border:0;background:none;cursor:pointer;transition:transform 60ms ease;
  }
  .units button img{height:100%;width:auto;display:block;margin:0 auto;object-fit:contain}
  .units button:active{transform:translateY(3px)}

  /* path */
  .pathwrap{position:relative;border-radius:26px;background:var(--polar);overflow:hidden}
  .track{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .track path{fill:none;stroke:var(--swan);stroke-width:9;stroke-linecap:round;stroke-dasharray:3 15;vector-effect:non-scaling-stroke}
  .node{
    z-index:1;position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;padding:0;border:0;
    background:none;box-shadow:none;border-radius:0;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 90ms ease;
  }
  .node span{width:100%;height:100%;display:block;pointer-events:none;background-repeat:no-repeat;background-position:center;background-size:contain}
  .node:active{transform:translateY(5px)}
  .node.locked{cursor:default;opacity:.9}
  .node.locked:active{transform:none}

  .node.current{z-index:3;width:164px;height:214px;margin:-130px 0 0 -82px;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .node.current:active{transform:translateY(5px)}



  .tallyspot{display:flex;align-items:center;gap:4px;margin-top:6px}
  .tallyspot .tally-art{
    width:92px;height:96px;flex:none;display:block;animation:bob 3s ease-in-out infinite;
    background:url("art/hand2.png") no-repeat center / contain;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .tallyspot .line{
    position:relative;flex:1;margin:0 0 0 -10px;min-height:78px;padding:12px 16px 14px 28px;
    background:url("art/say.png") no-repeat left center / 100% 100%;
    color:var(--eel);font-size:15px;font-weight:800;line-height:1.25;display:flex;align-items:center;
  }
</style>
</head>
<body class="tablet">
<div class="frame">

  <div class="top">
    <a class="back" href="hub.html" aria-label="Back"><img src="art/btn-back.png" alt=""></a>
    <div>
      <p class="sub">Practice path</p>
      <h1 id="crumb">Meet your fingers</h1>
    </div>
    <a class="levelbox" href="profile.html">
      <div class="avatar" id="av" aria-hidden="true"></div>
      <div class="lvl">
        <div class="lvl-top"><b id="lvl-name">Finger Counter</b><span id="lvl-xp">60 / 150 XP</span></div>
        <div class="bar2 lvl-bar"><i id="lvl-fill" style="width:40%"></i></div>
      </div>
    </a>
  </div>

  <div class="body" id="body">

    <section class="unitcard" id="card">
      <div class="head">
        <div class="kicker" id="u-kicker">Unit 1</div>
        <h2 id="u-name">Meet your fingers</h2>
        <p id="u-desc">Numbers on every fingertip</p>
      </div>
      <div class="mid">
        <div class="metric"><span>Lessons done</span><b id="u-count">2 of 6</b></div>
        <div class="bar2"><i id="u-bar" style="width:33%"></i></div>
        <div class="tallyspot"><div class="tally-art" aria-hidden="true"></div><p class="line" id="u-say">Your 6 times are next.</p></div>
      </div>
      <div class="units" id="switch"></div>
    </section>

    <section class="pathwrap" id="path"></section>

  </div>

</div>

<script src="levels.js"></script>
<script src="tally.js"></script>
<script>
(function () {
  var units = [
    {
      kicker: 'Unit 1', name: 'Meet your fingers', desc: 'Numbers on every fingertip',
      done: 2, tone: ['var(--green)', 'var(--green-lip)'], say: 'Your 6 times are next.',
      face: 'happy',
      nodes: [
        { t: 'lesson', s: 'done' }, { t: 'lesson', s: 'done' },
        { t: 'lesson', s: 'current' }, { t: 'chest', s: 'locked' },
        { t: 'lesson', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 2', name: 'Count the tens', desc: 'Fingers down make tens',
      done: 0, tone: ['var(--blue)', 'var(--blue-lip)'], say: 'Finish unit 1 first.',
      face: 'ready',
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'chest', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 3', name: 'Big numbers', desc: 'Nine times and ten times',
      done: 0, tone: ['var(--purple)', '#a95fd8'], say: 'The big ones come last.',
      face: 'thinking',
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'lesson', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    }
  ];

  // percentage positions along the winding path, so six nodes fit one screen
  // a calm zigzag: top left down to bottom right, no sharp reversals
  var SPOTS = [
    [22, 12], [43, 26], [64, 40], [42, 56], [23, 71], [46, 88]
  ];

  function art(n) {
    if (n.s === 'locked') return 'art/n-lock.png';
    if (n.s === 'done') return 'art/n-done.png';
    if (n.t === 'boss') return 'art/n-boss.png';
    return 'art/start.png';
  }

  var at = 0;
  var path = document.getElementById('path');
  var sw = document.getElementById('switch');

  function draw() {
    var u = units[at];
    var card = document.getElementById('card');
    document.querySelector('.frame').style.setProperty('--unit', u.tone[0]);
    document.querySelector('.frame').style.setProperty('--unit-lip', u.tone[1]);
    card.style.setProperty('--unit', u.tone[0]);
    card.style.setProperty('--unit-lip', u.tone[1]);

    document.getElementById('crumb').textContent = u.name;
    document.getElementById('u-kicker').textContent = u.kicker;
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-desc').textContent = u.desc;
    document.getElementById('u-count').textContent = u.done + ' of ' + u.nodes.length;
    document.getElementById('u-bar').style.width = (u.done / u.nodes.length * 100) + '%';
    document.getElementById('u-say').textContent = u.say;

    sw.innerHTML = units.map(function (x, i) {
      var state = i === at ? '-on' : '-off';
      return '<button type="button" data-u="' + i + '" class="' + (i === at ? 'on' : '') + '" aria-label="Unit ' + (i + 1) + '">' +
             '<img src="art/tile-' + (i + 1) + state + '.png" alt=""></button>';
    }).join('');

    var spots = u.nodes.map(function (n, i) { return SPOTS[i % SPOTS.length]; });
    var d = 'M ' + spots.map(function (p) { return p[0] + ' ' + p[1]; }).join(' L ');
    var html = '<svg class="track" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + '"></path></svg>';

    u.nodes.forEach(function (n, i) {
      var p = spots[i];
      var cls = 'node' + (n.s === 'locked' ? ' locked' : n.s === 'done' ? ' done' : ' current');
      html += '<button class="' + cls + '" type="button" data-status="' + n.s + '" ' +
        'style="left:' + p[0] + '%;top:' + p[1] + '%" aria-label="' + (n.s === 'current' ? 'Start' : n.t) + '">' +
        '<span style="background-image:url(' + art(n) + ')"></span></button>';
    });

    path.innerHTML = html;
  }

  sw.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    at = Number(b.dataset.u);
    draw();
  });

  path.addEventListener('click', function (e) {
    var n = e.target.closest('.node');
    if (!n || n.dataset.status === 'locked') return;
    window.location.href = 'check.html';
  });

  function level() {
    var i = TF.info();
    document.getElementById('lvl-name').textContent = i.name;
    document.getElementById('lvl-xp').textContent = i.next ? i.inLevel + ' / ' + i.span + ' XP' : 'Top level';
    document.getElementById('lvl-fill').style.width = i.percent + '%';
  }
  level();

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  draw();
})();
</script>
</body>
</html>
