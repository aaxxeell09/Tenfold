<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Tenfold · Practice</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lesson.css">
</head>
<body class="tablet">
<div class="frame">
<div class="app">

  <aside class="side" aria-label="Main">
    <div class="wordmark">tenfold</div>
    <nav class="side-nav">
      <a class="nav-item" href="learn.html"><span class="nav-icon"><svg viewBox="0 0 48 48"><use href="#icon-home"></use></svg></span><span>Learn</span></a>
      <a class="nav-item is-active" href="practice.html"><span class="nav-icon"><svg viewBox="0 0 48 48"><use href="#icon-grid"></use></svg></span><span>Practice</span></a>
      <a class="nav-item" href="hub.html"><span class="nav-icon"><svg viewBox="0 0 48 48"><use href="#icon-unicorn"></use></svg></span><span>Profile</span></a>
    </nav>
  </aside>

  <main class="center" id="practice">
    <p class="path-hint">Practice path</p>
    <div id="course"></div>
  </main>

  <aside class="right">
    <div class="stats">
      <div class="stat stat-streak"><svg viewBox="0 0 48 48"><use href="#icon-flame"></use></svg>6</div>
      <div class="stat stat-xp"><svg viewBox="0 0 48 48"><use href="#icon-xp"></use></svg>240</div>
      <div class="stat stat-stars"><svg viewBox="0 0 48 48"><use href="#icon-star"></use></svg>22</div>
    </div>

    <section class="panel">
      <div class="quest-head"><h3>Hands quest</h3><span>2 of 3</span></div>
      <div class="quest-row">
        <svg viewBox="0 0 48 48" style="color:var(--green)"><use href="#icon-lesson"></use></svg>
        <div style="flex:1">
          <div class="quest-title">Show 10 correct touches</div>
          <div class="bar"><i class="bar-fill" style="width:60%"></i><span class="bar-label">6 / 10</span></div>
        </div>
      </div>
    </section>

    <section class="panel panel-hands">
      <div class="panel-hands-art"><svg viewBox="0 0 48 48" style="width:64px;height:64px;color:var(--green)"><use href="#icon-lesson"></use></svg></div>
      <div>
        <h3>Use your real hands</h3>
        <p>The camera checks your fingers while you count.</p>
      </div>
    </section>
  </aside>

</div>
</div>

<script src="tally.js"></script>
<script>
(function () {
  var units = [
    {
      kicker: 'Unit 1', name: 'Meet your fingers', desc: 'Numbers on every fingertip', count: '6/15',
      tone: ['var(--green)', 'var(--green-lip)'], mascot: 'right',
      nodes: [
        { t: 'lesson', s: 'done', stars: 3 }, { t: 'lesson', s: 'done', stars: 2 },
        { t: 'lesson', s: 'current' }, { t: 'chest', s: 'locked' },
        { t: 'lesson', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 2', name: 'Count the tens', desc: 'Fingers down make tens', count: '0/15',
      tone: ['var(--blue)', 'var(--blue-lip)'], mascot: 'left',
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'chest', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 3', name: 'Big numbers', desc: 'Nine times and ten times', count: '0/15',
      tone: ['var(--purple)', '#a95fd8'],
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'boss', s: 'locked' }
      ]
    }
  ];

  var offsets = [0, -58, -92, -58, 0, 58, 92, 58];

  function icon(n) {
    if (n.t === 'chest') return n.s === 'locked' ? 'icon-chest-locked' : 'icon-chest';
    if (n.t === 'boss') return n.s === 'done' ? 'icon-boss-done' : n.s === 'locked' ? 'icon-boss-locked' : 'icon-boss';
    return n.s === 'done' ? 'icon-lesson-done' : n.s === 'locked' ? 'icon-lesson-locked' : 'icon-lesson';
  }

  function stars(n) {
    if (!n.stars) return '<div class="mini-stars"></div>';
    var out = '<div class="mini-stars">';
    for (var i = 0; i < 3; i++) {
      out += '<svg viewBox="0 0 48 48" class="' + (i < n.stars ? '' : 'off') + '"><use href="#icon-star"></use></svg>';
    }
    return out + '</div>';
  }

  function nodeHtml(n, i) {
    var box = n.t === 'chest' ? '0 0 88 80' : '0 0 48 48';
    var cls = 'node' + (n.t === 'boss' ? ' node-boss' : n.t === 'chest' ? ' node-chest' : '') +
      (n.s === 'locked' ? ' is-locked' : n.s === 'done' ? ' is-done' : ' is-current');
    var ring = n.s === 'current'
      ? '<svg class="ring" viewBox="0 0 102 102"><circle cx="51" cy="51" r="44"></circle>' +
        '<circle class="ring-arc" cx="51" cy="51" r="44" stroke-dasharray="276" stroke-dashoffset="186"></circle></svg>'
      : '';
    var bubble = n.s === 'current' ? '<div class="bubble">Start</div>' : '';
    return '<div class="row' + (n.s === 'current' ? ' is-open' : '') + '">' +
             '<div class="node-wrap" style="--x:' + offsets[i % offsets.length] + 'px">' +
               bubble +
               '<button class="' + cls + '" type="button" data-status="' + n.s + '">' +
                 '<svg viewBox="' + box + '"><use href="#' + icon(n) + '"></use></svg>' +
               '</button>' + ring + stars(n) +
             '</div>' +
           '</div>';
  }

  var html = '';
  units.forEach(function (u) {
    html += '<section class="unit" style="--unit:' + u.tone[0] + ';--unit-lip:' + u.tone[1] + '">' +
      '<div class="unit-banner"><div>' +
        '<div class="unit-kicker">' + u.kicker + '</div><h2>' + u.name + '</h2><p>' + u.desc + '</p>' +
      '</div><div class="unit-count"><svg viewBox="0 0 48 48"><use href="#icon-star"></use></svg>' + u.count + '</div></div>' +
      '<div class="path">';
    u.nodes.forEach(function (n, i) { html += nodeHtml(n, i); });
    if (u.mascot) {
      html += '<div class="row"><div class="mascot mascot-' + u.mascot + '">' +
        '<div class="tally" data-tally="' + (u.mascot === 'right' ? 'happy' : 'ready') + '"></div></div></div>';
    }
    html += '</div></section>';
  });
  document.getElementById('course').innerHTML = html;

  document.getElementById('course').addEventListener('click', function (e) {
    var node = e.target.closest('.node');
    if (!node || node.dataset.status === 'locked') return;
    window.location.href = 'lesson.html';
  });

  if (window.Tally) window.Tally.mount();
  if (window.Icons) window.Icons.expand(document);
})();
</script>
</body>
</html>
