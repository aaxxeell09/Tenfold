<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194, height=834, initial-scale=1, viewport-fit=cover">
<title>Tenfold · Practice</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.tablet{height:100vh;overflow:hidden;background:var(--polar);display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;flex:none;width:1194px;height:834px;overflow:hidden;background:var(--snow);
    transform:scale(var(--fit,1));transform-origin:center center;
    display:flex;flex-direction:column;padding:26px 34px 24px;gap:20px;
  }

  /* top bar */
  .top{display:flex;align-items:center;gap:18px;flex:none}
  .back{
    width:60px;height:60px;flex:none;border:2px solid var(--swan);border-radius:20px;background:var(--snow);
    box-shadow:0 4px 0 var(--swan);color:var(--wolf);display:flex;align-items:center;justify-content:center;
    text-decoration:none;transition:transform 60ms ease,box-shadow 60ms ease;
  }
  .back svg{width:28px;height:28px}
  .back:active{transform:translateY(4px);box-shadow:0 0 0 var(--swan)}
  .top h1{margin:0;font-size:26px;font-weight:900;color:var(--eel)}
  .top .sub{margin:2px 0 0;font-size:15px;font-weight:800;color:var(--hare);letter-spacing:.6px;text-transform:uppercase}
  .levelbox{
    margin-left:auto;display:flex;align-items:center;gap:14px;height:64px;padding:0 20px 0 12px;
    border:2px solid var(--swan);border-radius:20px;background:var(--snow);text-decoration:none;
  }
  .levelbox .avatar{width:46px;flex:none}
  .lvl{min-width:216px}
  .lvl-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:7px}
  .lvl-top b{font-size:18px;font-weight:900;color:var(--eel)}
  .lvl-top span{font-size:14px;font-weight:800;color:var(--hare)}
  .lvl-bar{height:12px}
  .lvl-bar i{background:var(--green)}

  /* body */
  .body{flex:1;display:grid;grid-template-columns:352px minmax(0,1fr);gap:30px;min-height:0}

  /* unit card */
  .unitcard{
    display:flex;flex-direction:column;gap:0;border-radius:26px;overflow:hidden;
    background:var(--snow);box-shadow:0 0 0 2px var(--swan) inset;
  }
  .unitcard .head{background:var(--unit);color:var(--snow);padding:22px 24px 24px;box-shadow:0 4px 0 var(--unit-lip)}
  .unitcard .kicker{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.9}
  .unitcard h2{margin:3px 0 4px;font-size:29px;font-weight:900;line-height:1.1}
  .unitcard .head p{margin:0;font-size:16px;font-weight:700;opacity:.92}
  .unitcard .mid{padding:22px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
  .metric{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;color:var(--wolf)}
  .metric b{color:var(--eel);font-size:19px}
  .bar2{position:relative;height:16px;border-radius:8px;background:var(--swan);overflow:hidden}
  .bar2 i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--unit)}
  .units{display:flex;gap:10px;padding:0 24px 22px}
  .units button{
    flex:1;height:44px;border:2px solid var(--swan);border-radius:14px;background:var(--snow);
    font-family:var(--font);font-size:15px;font-weight:900;color:var(--hare);cursor:pointer;
  }
  .units button.on{border-color:var(--unit);background:var(--unit);color:var(--snow);box-shadow:0 3px 0 var(--unit-lip)}

  /* path */
  .pathwrap{position:relative;border-radius:26px;background:var(--polar);overflow:hidden}
  .track{position:absolute;inset:0;width:100%;height:100%}
  .track path{fill:none;stroke:#dcdcdc;stroke-width:8;stroke-linecap:round;stroke-dasharray:1 18;vector-effect:non-scaling-stroke}
  .node{
    position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;padding:0;border:0;border-radius:50%;
    background:var(--unit);box-shadow:0 7px 0 var(--unit-lip);color:var(--snow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform 70ms ease,box-shadow 70ms ease;
  }
  .node svg{width:52px;height:52px;color:currentColor}
  .node:active{transform:translateY(7px);box-shadow:0 0 0 var(--unit-lip)}
  .node.done{background:var(--unit);box-shadow:0 7px 0 var(--unit-lip)}
  .node.locked{background:var(--swan);box-shadow:0 7px 0 #cfcfcf;color:#a9a9a9;cursor:default}
  .node.locked:active{transform:none;box-shadow:0 7px 0 #cfcfcf}
  .node.chest svg{width:62px;height:56px}
  .node.boss{width:116px;height:116px;margin:-58px 0 0 -58px}
  .node.boss svg{width:64px;height:64px}


  .ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none}
  .ring circle{fill:none;stroke:#e8e8e8;stroke-width:7}
  .ring .arc{stroke:var(--unit);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .bubble{
    position:absolute;transform:translate(-50%,-100%);padding:10px 18px;border-radius:14px;
    border:2px solid var(--swan);background:var(--snow);color:var(--unit-lip);
    font-size:15px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;
    z-index:3;animation:hop 1.6s ease-in-out infinite;
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;margin-left:-7px;
    background:var(--snow);border-right:2px solid var(--swan);border-bottom:2px solid var(--swan);transform:rotate(45deg);
  }
  @keyframes hop{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 7px))}}

  .tallyspot{display:flex;align-items:flex-end;gap:14px;margin-top:6px}
  .tallyspot .tally{width:82px;flex:none}
  .tallyspot .line{
    position:relative;margin-bottom:12px;flex:1;padding:13px 16px;border-radius:16px;border:2px solid var(--swan);
    background:var(--snow);color:var(--eel);font-size:15px;font-weight:800;line-height:1.25;
  }
  .tallyspot .line::after{
    content:"";position:absolute;left:-8px;bottom:14px;width:13px;height:13px;background:var(--snow);
    border-left:2px solid var(--swan);border-bottom:2px solid var(--swan);transform:rotate(45deg);
  }
</style>
</head>
<body class="tablet">
<div class="frame">

  <div class="top">
    <a class="back" href="hub.html" aria-label="Back">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M 28 12 L 16 24 L 28 36" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <div>
      <p class="sub">Practice path</p>
      <h1 id="crumb">Meet your fingers</h1>
    </div>
    <a class="levelbox" href="profile.html">
      <div class="tally avatar" id="av" data-tally="happy"></div>
      <div class="lvl">
        <div class="lvl-top"><b id="lvl-name">Finger Counter</b><span id="lvl-xp">60 / 150 XP</span></div>
        <div class="bar2 lvl-bar"><i id="lvl-fill" style="width:40%"></i></div>
      </div>
    </a>
  </div>

  <div class="body" id="body">

    <section class="unitcard" id="card">
      <div class="head">
        <div class="kicker" id="u-kicker">Unit 1</div>
        <h2 id="u-name">Meet your fingers</h2>
        <p id="u-desc">Numbers on every fingertip</p>
      </div>
      <div class="mid">
        <div class="metric"><span>Lessons done</span><b id="u-count">2 of 6</b></div>
        <div class="bar2"><i id="u-bar" style="width:33%"></i></div>
        <div class="tallyspot"><div class="tally" id="u-tally" data-tally="happy"></div><p class="line" id="u-say">Your 6 times are next.</p></div>
      </div>
      <div class="units" id="switch"></div>
    </section>

    <section class="pathwrap" id="path"></section>

  </div>

</div>

<script src="levels.js"></script>
<script src="tally.js"></script>
<script>
(function () {
  var units = [
    {
      kicker: 'Unit 1', name: 'Meet your fingers', desc: 'Numbers on every fingertip',
      done: 2, tone: ['var(--green)', 'var(--green-lip)'], say: 'Your 6 times are next.',
      face: 'happy',
      nodes: [
        { t: 'lesson', s: 'done' }, { t: 'lesson', s: 'done' },
        { t: 'lesson', s: 'current' }, { t: 'chest', s: 'locked' },
        { t: 'lesson', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 2', name: 'Count the tens', desc: 'Fingers down make tens',
      done: 0, tone: ['var(--blue)', 'var(--blue-lip)'], say: 'Finish unit 1 first.',
      face: 'ready',
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'chest', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    },
    {
      kicker: 'Unit 3', name: 'Big numbers', desc: 'Nine times and ten times',
      done: 0, tone: ['var(--purple)', '#a95fd8'], say: 'The big ones come last.',
      face: 'thinking',
      nodes: [
        { t: 'lesson', s: 'locked' }, { t: 'lesson', s: 'locked' },
        { t: 'lesson', s: 'locked' }, { t: 'boss', s: 'locked' }
      ]
    }
  ];

  // percentage positions along the winding path, so six nodes fit one screen
  var SPOTS = [
    [20, 14], [47, 26], [71, 43], [48, 60], [20, 71], [44, 88]
  ];

  function icon(n) {
    if (n.t === 'chest') return n.s === 'locked' ? 'icon-chest-locked' : 'icon-chest';
    if (n.t === 'boss') return n.s === 'done' ? 'icon-boss-done' : n.s === 'locked' ? 'icon-boss-locked' : 'icon-boss';
    return n.s === 'done' ? 'icon-lesson-done' : n.s === 'locked' ? 'icon-lesson-locked' : 'icon-lesson';
  }

  var at = 0;
  var path = document.getElementById('path');
  var sw = document.getElementById('switch');

  function draw() {
    var u = units[at];
    var card = document.getElementById('card');
    document.querySelector('.frame').style.setProperty('--unit', u.tone[0]);
    document.querySelector('.frame').style.setProperty('--unit-lip', u.tone[1]);
    card.style.setProperty('--unit', u.tone[0]);
    card.style.setProperty('--unit-lip', u.tone[1]);

    document.getElementById('crumb').textContent = u.name;
    document.getElementById('u-kicker').textContent = u.kicker;
    document.getElementById('u-name').textContent = u.name;
    document.getElementById('u-desc').textContent = u.desc;
    document.getElementById('u-count').textContent = u.done + ' of ' + u.nodes.length;
    document.getElementById('u-bar').style.width = (u.done / u.nodes.length * 100) + '%';
    document.getElementById('u-say').textContent = u.say;
    if (window.Tally) window.Tally.set(document.getElementById('u-tally'), u.face);

    sw.innerHTML = units.map(function (x, i) {
      return '<button type="button" data-u="' + i + '" class="' + (i === at ? 'on' : '') + '">' + (i + 1) + '</button>';
    }).join('');

    var spots = u.nodes.map(function (n, i) { return SPOTS[i % SPOTS.length]; });
    var d = 'M ' + spots.map(function (p) { return p[0] + ' ' + p[1]; }).join(' L ');
    var html = '<svg class="track" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + '"></path></svg>';

    u.nodes.forEach(function (n, i) {
      var p = spots[i];
      var cls = 'node' + (n.t === 'chest' ? ' chest' : n.t === 'boss' ? ' boss' : '') +
        (n.s === 'locked' ? ' locked' : n.s === 'done' ? ' done' : '');
      var box = n.t === 'chest' ? '0 0 88 80' : '0 0 48 48';
      if (n.s === 'current') {
        html += '<svg class="ring" style="left:' + p[0] + '%;top:' + p[1] + '%" viewBox="0 0 132 132" aria-hidden="true">' +
          '<circle cx="66" cy="66" r="62"></circle>' +
          '<circle class="arc" cx="66" cy="66" r="62" stroke-dasharray="389" stroke-dashoffset="262"></circle></svg>';
        html += '<div class="bubble" style="left:' + p[0] + '%;top:calc(' + p[1] + '% - 86px)">Start</div>';
      }
      html += '<button class="' + cls + '" type="button" data-status="' + n.s + '" ' +
        'style="left:' + p[0] + '%;top:' + p[1] + '%" aria-label="' + n.t + '">' +
        '<svg viewBox="' + box + '"><use href="#' + icon(n) + '"></use></svg></button>';
    });

    path.innerHTML = html;
    if (window.Icons) window.Icons.expand(path);
  }

  sw.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    at = Number(b.dataset.u);
    draw();
  });

  path.addEventListener('click', function (e) {
    var n = e.target.closest('.node');
    if (!n || n.dataset.status === 'locked') return;
    window.location.href = 'check.html';
  });

  function level() {
    var i = TF.info();
    document.getElementById('lvl-name').textContent = i.name;
    document.getElementById('lvl-xp').textContent = i.next ? i.inLevel + ' / ' + i.span + ' XP' : 'Top level';
    document.getElementById('lvl-fill').style.width = i.percent + '%';
    if (window.Tally) window.Tally.set(document.getElementById('av'), 'happy', i.accessories);
  }
  level();

  function fit() {
    var s = Math.min(1, window.innerWidth / 1194, window.innerHeight / 834);
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  draw();
})();
</script>
</body>
</html>
